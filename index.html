:root {
  color-scheme: light;
  --page: #f9f6ed;
  --paper: #fffaf0;
  --ink: #263b36;
  --muted: #50685d;
  --line: #c6c9b7;
  --line-dark: #899b8c;
  --teal: #286858;
  --rose: #a24454;
  --gold: #926720;
  --quiet: #6e8073;
  --button: #254e43;
  --button-ink: #fffdf3;
  --light-teal: #dce9d8;
  --light-rose: #f4dedb;
  --light-gold: #f2e5ba;
  --sea: #dceae6;
  --sea-line: #83aaa4;
  --shore: #828f78;
  --shoal: #b9cebf;
  --paper-shadow: rgba(62, 68, 47, 0.14);
  --print-dot: rgba(65, 90, 68, 0.15);
  --sans: Nunito, 'Survey Sans', system-ui, sans-serif;
  --serif: 'Survey Serif', Georgia, 'Survey Sans', serif;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Survey Sans', monospace;
  --shadow: rgba(54, 66, 48, 0.15);
}
html[data-theme='dark'] {
  color-scheme: dark;
  --page: #1e2b28;
  --paper: #24332e;
  --ink: #f4efda;
  --muted: #c3cbb6;
  --line: #4c6053;
  --line-dark: #788f7f;
  --teal: #9ed6ba;
  --rose: #f0a7a7;
  --gold: #e2c586;
  --quiet: #a9bbab;
  --button: #bbdbc7;
  --button-ink: #1b372c;
  --light-teal: #354c3e;
  --light-rose: #513b3c;
  --light-gold: #4e4733;
  --sea: #2a4443;
  --sea-line: #769895;
  --shore: #849c86;
  --shoal: #395757;
  --paper-shadow: rgba(0, 0, 0, 0.24);
  --print-dot: rgba(168, 185, 159, 0.14);
  --shadow: rgba(9, 22, 17, 0.34);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  color: var(--ink);
  background: var(--page);
}
body {
  font: 510 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button,
select,
input {
  font: inherit;
  color: inherit;
}
button,
a {
  touch-action: manipulation;
}
button {
  border: 0;
  background: none;
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.36;
}
button:hover:not(:disabled),
a:hover {
  color: var(--rose);
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid var(--rose);
  outline-offset: 3px;
}
a {
  color: var(--teal);
  text-underline-offset: 0.22em;
}
svg {
  display: block;
}
.icon {

.glyph-text,

}

.comparisons,

}
.notes-body p,

}
.source {

}
.paper-source span {
  color: var(--quiet);

}
.pair-picker,

}

}
select {
  max-width: 100%;

}
.field {

}
.comparisons p {

}

}

.bars i {

.bars u {
  background: var(--gold);
}
.bars > div:nth-child(2) u {

}

  background: var(--rose);

.results p {

<noscript><main class="nojs"><h1>递归自我改进 · Recursive Self-Improvement</h1><p>从一次求解到学会怎样改进，十一篇论文按机制串起一条线。启用 JavaScript 可逐步播放方法图，或从下列原论文开始阅读。</p><p>Eleven papers trace a path from solving one task to changing the strategy that improves the solver. Enable JavaScript for the worked figures, or read the original papers below.</p><ol><li><a href="https://arxiv.org/abs/2303.17651">Self-Refine</a></li><li><a href="https://arxiv.org/abs/2303.11366">Reflexion</a></li><li><a href="https://arxiv.org/abs/2509.25140">ReasoningBank</a></li><li><a href="https://arxiv.org/abs/2203.14465">STaR</a></li><li><a href="https://arxiv.org/abs/2506.10943">SEAL</a></li><li><a href="https://arxiv.org/abs/2603.28052">Meta-Harness</a></li><li><a href="https://arxiv.org/abs/cs/0309048">Gödel Machine</a></li><li><a href="https://arxiv.org/abs/2505.22954">Darwin Gödel Machine</a></li><li><a href="https://arxiv.org/abs/2310.02304">STOP</a></li><li><a href="https://arxiv.org/abs/2603.19461">Hyperagents</a></li><li><a href="https://arxiv.org/abs/2611.26806">MedicalRSI</a></li></ol></main></noscript>
<script id="survey-data">
"use strict";
const T = (zh, en) => [zh, en];
const step = (zh, en, detailZh, detailEn) => ({ title: T(zh, en), detail: T(detailZh, detailEn) });
const CHAPTERS = [
  { id:'agent', short:T('一次求解','One attempt'), title:T('先看一个 Agent 做完一次任务','Follow one agent through a task'), intro:T('从一条真实评测轨迹出发。先认清是谁做决定、谁执行动作，才看得出后来是哪一部分发生了变化。','Start with an actual benchmark trace. Locating the decision, the action and the observation makes it possible to see exactly what later methods change.') },
  { id:'memory', short:T('留下经验','Memory'), title:T('上一次的失败，下一次怎样读到？','How does a failure reach the next attempt?'), intro:T('一次回答会结束。把教训写在模型之外，它就能跨过重试边界。能否跨过任务边界，还取决于写什么、怎样取回。','An answer has an end. A written lesson can survive a retry. Reusing it on a different task also requires deciding what to store and how to find it again.') },
  { id:'weights', short:T('改变权重','Weights'), title:T('把经验写进模型','Put the experience into the model'), intro:T('另一个保存位置是模型参数。先看训练数据怎么产生，再看提出训练数据的策略能否一起学习。','Weights offer another place to keep experience. First trace how a model makes its training examples, then how it learns to make better ones.') },
  { id:'search', short:T('搜索 Harness','Harness search'), title:T('把整个 Harness 交给外层 Agent 改','Give the whole harness to an outer agent'), intro:T('如果问题出在上下文组织或工具调用，能否让一个专门读运行记录的 Agent 找到更好的实现？','If a failure begins with context selection or a tool call, could a second agent inspect the run and write a better implementation?') },
  { id:'inherit', short:T('继承代码','Inheritance'), title:T('当被改的代码也是下一代的工具','When edited code becomes the next generation’s tool'), intro:T('改解题程序，可能也会改变它将来修改自身的能力。新版本凭什么被接受？先看以证明为准的方案，再看以实验为准的方案。','Editing a task program can change its ability to edit itself later. What lets a new version take effect? Compare a proof-based rule with empirical testing.') },
  { id:'improver', short:T('改进者','The improver'), title:T('怎样看出 Improver 本身进步了？','How can we tell the improver got better?'), intro:T('三篇文章把这个问题变成了不同的实验。依次看改写搜索程序、移植元 Agent，以及固定 Solver 后更换写 Harness 的模型。','Three papers turn the question into distinct experiments. Follow a rewritten search program, a transplanted meta agent and a harness writer paired with a fixed solver.') },
  { id:'compare', short:T('对照论文','Compare'), title:T('把两篇论文放在同一张桌上','Compare two papers on the same questions'), intro:T('选两篇文章，逐项对照反馈、保留的改动和检验证据。这也是读下一篇自我改进论文时可以沿用的顺序。','Choose two papers to compare their feedback, what survives and the experiment that tests the claim. The same questions work for the next paper you read.') }
];
const STORIES = [
  { id:'base-agent', chapter:'agent', name:'Base Agent', author:'MedicalRSI', year:'2026', arxiv:'2611.26806', locator:T('图 9 · 未见工作流个案','Fig. 9 · unseen-workflow case'),
    title:T('一次运行，留下什么？','What does one run leave behind?'),
    body:T('用 MedicalRSI 的模拟病历工作流作起点。模型根据当前上下文选动作。Harness 是模型周围运行它的软件，包括提示与上下文、可用工具、工作流控制和记忆。它执行工具调用，把观察送回模型。整个循环在这里叫 Solver。','Consider a simulated records workflow from MedicalRSI. The model chooses an action from its context. Its harness supplies instructions, context, tools, workflow control and memory, executes the action and returns observations. This whole task-solving loop is the Solver.'),
    evidence:T('论文的这个未见工作流中，Solver 单独运行只通过了 11 项检查中的 2 项。运行日志记下了查到哪些记录、哪一步遗漏，以及评测器怎样判定结果。','In this unseen-workflow example the unaided Solver passes 2 of 11 checks. Its trace records what it retrieved and what it missed. The grader records which requirements the run satisfied.'),
    boundary:T('稍后回到同一条轨迹，看另一个角色怎样把失败写成 Harness，以及谁来判断这个改动有用。','We return to this very trace when a second role writes a harness and its benefit can be tested.'),
    steps:[step('接到工作流','Receive the task','一项模拟记录工作流进入 Solver，目标和可用工具成为输入。','A simulated records workflow arrives with a goal and a set of tools.'),step('模型选动作','Choose an action','模型读取上下文，选择查询记录。工具接口和上下文组织由 Harness 提供。','The model selects a record lookup from its context. The harness defines the interface and what the model sees.'),step('工具返回观察','Return an observation','Harness 执行查询，把观察追加到轨迹中。模型据此选择后续动作。','The harness executes the lookup and appends the observation to the trace for the model’s next decision.'),step('评测留下轨迹','Grade the run','图 9 的原始运行漏掉了时间窗和两项操作。2/11 是这个个案的检查通过数。','The original run misses a time window and two actions. The 2/11 count refers to this single case.')],
    handoff:T('如果只把这次的输出交回模型，最先能改的是什么？','If the model sees its own output again, what is the first thing it can change?') },
  { id:'self-refine', chapter:'agent', name:'Self-Refine', author:'Madaan et al.', year:'2023', arxiv:'2303.17651', locator:T('图 1–2 · 算法 1','Figs. 1–2 · Algorithm 1'),
    title:T('在同一道题内改答案','Revise an answer within one task'),
    body:T('以论文的代码优化任务为例，同一个语言模型先写一个解，再用另一条提示指出可改进之处。第三次调用同时看到初稿和反馈，写出新稿。循环在停止条件满足时交付当前版本。','In the paper’s code-optimization task one language model writes a solution, then critiques it under a different prompt. A third call sees both the draft and feedback and produces a revision. The loop returns the current draft when its stopping rule fires.'),
    evidence:T('作者在七类任务上把多轮版本与同一模型的一次生成比较。生成物的质量可以在这次运行内提升。','Across seven tasks the authors compare revisions with one-shot answers from the same model. That comparison tests the quality of the output produced during a run.'),
    boundary:T('下一道题仍调用原来的模型和提示。单次运行的改稿分数无法测出跨题学习。','The next independent task starts with the same model and prompts. A revision score measures improvement within the current task.'),
    fields:[T('对当前草稿的文字反馈','A critique of the current draft'),T('当前题的修订稿','The current task’s revised draft'),T('同一模型分三种提示调用','One model under three prompts'),T('同题初稿与修订稿','Initial vs revised answer on one task')],
    steps:[step('初稿','Draft','第一次调用得到当前版本，论文示例中是待优化的代码。','The first call produces the candidate, a piece of code in the optimization example.'),step('批注','Critique','反馈调用指出具体问题，初稿和批注同时留在这一轮的上下文里。','The feedback call identifies a concrete weakness. Both the critique and draft remain available.'),step('修订','Revise','修订调用读两份材料，返回一份替换草稿。','The refiner reads both artifacts and returns a replacement draft.'),step('停止或再改','Stop or repeat','停止条件决定交付当前稿或继续批注。下一独立任务会新建上下文。','The stopping rule returns this draft or requests another critique. An independent task starts a fresh context.')],
    handoff:T('留下批注，让下一次重试读到它。Reflexion 把这个动作写进了 Agent。','Keep a critique for the next trial. Reflexion builds that handoff into an agent.') },
  { id:'reflexion', chapter:'memory', name:'Reflexion', author:'Shinn et al.', year:'2023', arxiv:'2303.11366', locator:T('图 2–3 · ALFWorld','Figs. 2–3 · ALFWorld'),
    title:T('把失败留给下一次重试','Leave a failed trial a note for the retry'),
    body:T('在 ALFWorld 文本环境里，Actor 连续执行动作。Evaluator 判断这轮是否完成。失败时，反思模块把结果和轨迹写成一段短记忆。重置环境后，Actor 带着这段记忆再试同一项任务。','In the ALFWorld text environment an actor takes a sequence of actions. An evaluator assesses the attempt. After a failure, a reflection module turns the outcome and trajectory into a short memory. The environment resets and the actor reads the note on its retry.'),
    evidence:T('图 3 在 134 个 ALFWorld 任务上跟踪随重试累计解决的比例。横轴上的每一步都允许再尝试一次。','Figure 3 tracks the cumulative share solved across 134 ALFWorld tasks as retries are allowed. Each tick grants another attempt.'),
    boundary:T('这一实验测试同一任务上的记忆和重试。要检验跨任务经验，还得把记忆交给另一道题。','This experiment tests memory across retries of a task. Cross-task reuse requires delivering a lesson to a different task.'),
    fields:[T('环境结果与动作轨迹','Environment outcome and trajectory'),T('供重试读取的反思记忆','An episodic note for a retry'),T('Actor、评估与反思模块','Actor, evaluator and reflection module'),T('ALFWorld 的累计重试成功率','Cumulative ALFWorld success across retries')],
    steps:[step('尝试','Act','Actor 在环境中行动，轨迹逐步增长。','The actor works in the environment and accumulates a trace.'),step('识别失败','Evaluate','环境完成信号或评估器给这一轮一个结果。','An environment signal or evaluator assesses this attempt.'),step('写反思','Write a reflection','把失败轨迹和反馈压缩为一段面向下一次行动的建议。','The reflector turns the trace and feedback into advice for a future action.'),step('带记忆重试','Retry with memory','环境回到起点，短记忆进入 Actor 的上下文。','The environment resets and the note enters the actor’s context.')],
    handoff:T('换一道题时，怎样找到值得复用的教训？','Once the task changes, which lesson should the agent retrieve?') },
  { id:'reasoningbank', chapter:'memory', name:'ReasoningBank', author:'Ouyang et al.', year:'2025', arxiv:'2509.25140', locator:T('图 2 · 表 1','Fig. 2 · Table 1'),
    title:T('从成功和失败中提取可检索的策略','Retrieve strategies from successes and failures'),
    body:T('新任务先按语义相似度从记忆库取回策略。任务结束后，模型判断轨迹是否成功，从成功路径提炼可复用的做法，从失败路径提炼应躲开的错误。新条目回到同一个库，供后续任务检索。','A new task first retrieves strategies by semantic similarity. After the run a model judges the trajectory, distills reusable practices from successes and pitfalls from failures, and stores new items in the same bank for later tasks.'),
    evidence:T('WebArena 上，Gemini 2.5 Flash 无记忆时成功率为 40.5%，使用 ReasoningBank 时为 48.8%。表 1 中两者的平均交互步数分别为 9.7 和 8.3。','On WebArena, Gemini 2.5 Flash succeeds on 40.5% of tasks without memory and 48.8% with ReasoningBank. Mean interaction steps are 9.7 and 8.3 respectively in Table 1.'),
    boundary:T('写入变多和检索变好可以提高任务表现。论文另用不同采样预算研究 MaTTS，比较时要看清采样设置。','A growing, more useful memory can raise task performance. The separate MaTTS experiments also vary sampling, so their compute setting matters.'),
    fields:[T('自评成功与失败的轨迹','Self-judged successes and failures'),T('跨任务检索的策略条目','Retrievable cross-task strategies'),T('提取与检索记忆的流程','Memory extraction and retrieval'),T('同一骨干模型，有无记忆','Same backbone, with and without memory')],
    steps:[step('按题检索','Retrieve','用当前任务查询历史记忆，只把相关条目送进上下文。','Use the current query to retrieve relevant items and place them in context.'),step('完成任务','Run','Agent 依据检索到的策略行动，并保留成功或失败的轨迹。','The agent acts with the retrieved strategies and retains the resulting trace.'),step('提炼条目','Distill','判断轨迹结果，把可迁移的策略或失败教训写成记忆条目。','Judge the outcome and distill a reusable strategy or failure lesson.'),step('下题取回','Reuse','把条目并入库中，下一项相关任务可以取回。','Consolidate the item. A later related task can retrieve it.')],
    aside:{name:'ACE',year:'2025',arxiv:'2510.04618',text:T('另一个写法是把上下文当作工作手册。ACE 的 Generator 标记条目是否有用，Reflector 提炼经验，Curator 产生局部增量，由程序合并进手册。这里保留的是带编号的条目和修改。','An alternative edits a playbook. ACE’s Generator marks useful entries, the Reflector extracts lessons and the Curator emits localized changes. A deterministic merge updates the numbered entries.')},
    handoff:T('如果关掉文字记忆，模型还能把经验带到下道题吗？','Could the lesson survive without a text memory at all?') },
  { id:'star', chapter:'weights', name:'STaR', author:'Zelikman et al.', year:'2022', arxiv:'2203.14465', locator:T('图 2 · 表 1','Fig. 2 · Table 1'),
    title:T('把经过筛选的理由变成训练数据','Turn selected rationales into training data'),
    body:T('模型先为带答案的训练题生成理由和预测。预测正确的理由进入训练集。答错时，把正确答案临时作为提示，请模型重新解释。通过检查的理由移除提示后用于微调，再用更新后的模型生成下一批。','The model produces a rationale and a prediction for labeled training questions. Correct predictions yield training examples. After a miss, the model gets the correct answer as a temporary hint and tries to explain it. Accepted rationales become finetuning targets without the hint. The updated model generates the next batch.'),
    evidence:T('CommonsenseQA 开发集上，GPT-J 直接按答案微调得到 60.0%，STaR 不做提示重生成得到 68.8%，加入这一步后得到 72.5%。','On the CommonsenseQA dev set GPT-J scores 60.0% with direct answer finetuning, 68.8% with STaR without rationalization, and 72.5% with rationalization.'),
    boundary:T('理由通过的是答案检查。正确答案本身不足以保证理由的每一步都成立。筛选规则由研究者设定。','Selection checks the final answer. An accepted rationale can still contain faulty reasoning. The selection procedure is specified by the researchers.'),
    fields:[T('已知训练答案与模型预测','Known training answers and predictions'),T('用自生成理由微调的权重','Weights fit to self-generated rationales'),T('固定的生成、筛选与微调程序','A prescribed generate–filter–finetune loop'),T('有无提示重生成的消融','Rationalization ablation')],
    steps:[step('先预测','Predict','在没有答案提示的情况下生成理由和预测。','Generate a rationale and prediction without revealing the answer.'),step('筛选或补提示','Filter or give a hint','正确的进入候选集。失败的训练例得到正确答案提示，再生成理由。','Keep correct predictions. A failed training question gets a correct-answer hint for another rationale.'),step('移除提示训练','Train without hints','训练输入只保留题目，合格理由和答案成为目标。','Use the question alone as input and the accepted rationale and answer as the training target.'),step('下一轮生成','Generate again','更新后的权重处理下一批问题，再执行同一筛选过程。','The updated weights generate a new batch under the same selection procedure.')],
    handoff:T('STaR 给定了筛选办法。能否用更新后的表现来教模型怎样写更新？','Could the updated model’s performance teach it how to write a better update?') },
  { id:'seal', chapter:'weights', name:'SEAL', author:'Zweiger et al.', year:'2025', arxiv:'2506.10943', locator:T('图 1、6 · 表 2','Figs. 1, 6 · Table 2'),
    title:T('用更新后的成绩奖励写更新的模型','Reward the model for the edit it writes'),
    body:T('以吸收一段新知识为例。模型把段落改写成自编辑训练材料。内层用这些材料微调一份模型，再撤走原段落做问答。外层拿这份模型的成绩奖励产生材料的策略。这里需要分清哪一次训练在吸收知识，哪一次在学习怎样吸收。','For knowledge incorporation, the model turns a passage into self-edit training material. An inner update fits a model on that material, then tests it on questions with the passage removed. An outer training loop rewards the policy that wrote the edit using downstream performance.'),
    evidence:T('Qwen2.5-7B 在单段落 LoRA 设置下，只用原段落微调得 33.5%，用基础模型额外生成材料得 39.7%，经过 SEAL 训练的自编辑得 47.0%。','For Qwen2.5-7B with single-passage LoRA, no-context QA accuracy is 33.5% with the passage alone, 39.7% with base-model synthetic material, and 47.0% with SEAL self-edits.'),
    boundary:T('外层学到了产生自编辑的策略，微调程序仍有预先设定的部分。图 6 还显示，连续写入新段落会损伤早先知识。','The outer loop learns an edit policy within a prescribed training procedure. Figure 6 also finds that sequential edits degrade retention of earlier passages.'),
    fields:[T('自编辑后模型的下游问答成绩','Downstream QA after applying an edit'),T('内层适配权重与外层自编辑策略','Adapted weights and a learned edit policy'),T('同一模型写材料，外层奖励训练策略','A model writes edits and outer rewards train that policy'),T('未训练与已训练的自编辑、遗忘测试','Untrained vs learned edits and retention tests')],
    steps:[step('读段落','Read a passage','用一段待吸收的新文本作为自编辑的条件。','Condition the self-edit on a passage to be incorporated.'),step('写材料','Write a self-edit','模型写出从段落推导的陈述，作为小规模微调材料。','The model generates implications of the passage as finetuning material.'),step('做内层更新','Apply the inner edit','微调模型后撤走原文，用相关问题检验写入效果。','Fit the model, remove the passage and evaluate the edit with related questions.'),step('训练编辑策略','Train the edit policy','将下游效果送回外层，改变以后产生自编辑的策略。','Feed downstream performance to the outer loop to update how future edits are generated.')],
    handoff:T('SEAL 改模型参数。把改动对象换成 Solver 周围的代码，会出现另一种搜索。','Change the target from weights to the software around the Solver and the search takes another form.') },
  { id:'meta-harness', chapter:'search', name:'Meta-Harness', author:'Lee et al.', year:'2026', arxiv:'2603.28052', locator:T('图 2 · 表 6','Fig. 2 · Table 6'),
    title:T('让提案者翻查每个旧版本的运行记录','Let the proposer open the history of every candidate'),
    body:T('论文把每个候选 Harness 的源码、执行轨迹和分数存入文件系统。外层编码 Agent 可以选择读哪次失败、对照哪段实现，然后提交新代码。评测程序运行新 Harness，把结果也存回历史。','Each candidate harness leaves source code, execution traces and scores in a filesystem. An outer coding agent chooses which failures and implementations to inspect, then proposes new code. Evaluation runs that harness and adds its records to the history.'),
    evidence:T('在 200 道 IMO 级数学题上，搜索到的同一个检索 Harness 交给五个留出的模型，相对无检索平均提高 4.7 个百分点。改动对其他 Solver 也有用。','On 200 IMO-level math problems, one discovered retrieval harness improves accuracy by 4.7 percentage points on average across five held-out models versus no retrieval. The artifact transfers to other solvers.'),
    boundary:T('外层 Agent 的可读历史持续增长。表 6 比较的是部署后的 Harness；判断提案者自己是否学得更会改，需要单独比较提案者。','The proposer’s accessible history grows. Table 6 measures the deployed harness. Isolating improvement in the proposer itself would require comparing proposers.'),
    fields:[T('全部候选的源码、分数与轨迹','Prior candidate code, scores and traces'),T('搜索到的 Harness 代码与历史','Discovered harness code and search history'),T('外层编码 Agent','An outer coding agent'),T('一个 Harness 迁移到留出的 Solver','One harness transfers to held-out solvers')],
    steps:[step('打开历史','Open history','每个候选各有一份代码、分数和执行轨迹，提案者按需打开。','Each candidate has its own code, score and traces. The proposer opens selected records.'),step('定位问题','Inspect a failure','沿失败轨迹回到生成这段上下文的 Harness 代码。','Trace a failed run back to the harness code that assembled its context.'),step('提交新代码','Propose code','外层 Agent 提交一个可执行候选，例如修改数学检索策略。','The outer agent proposes executable code, such as a revised math retrieval strategy.'),step('评测并归档','Evaluate and file','在评测任务上运行，源码、轨迹和成绩一起进入历史。','Run the evaluation and file the candidate, traces and scores together.')],

  return WATCH[s.id][k + 1];
}
function stepName(s, k) {

  return s.steps[k].title;
}
function head() {

}
function mapScreen() {
  return `<main id="content" class="atlas-screen" tabindex="-1"><div class="map-heading"><div><h1>${B('递归自我改进图谱', 'Recursive Self-Improvement Atlas')}</h1><p>${B('从 Base Agent 到会改进自己的 Agent。点一站，播放它的方法。', 'From a base agent to an agent that improves its improver. Pick a stop to see it work.')}</p></div><button class="primary start" data-start>${icon('play')}${B('从起点播放', 'Play the route')}</button></div><div class="map-frame"><div class="map-mat"></div></div></main>`;

function choices(s) {

    : '';
}
function watchScreen() {

}
let mapSizing = '',
  mapObserver = null;
function fitMap() {
  const mat = document.querySelector('.map-mat');
  if (!mat) return;
  const { width, height } = mat.getBoundingClientRect();
  if (!width || !height) return;
  const key = [narrow.matches, Math.round(width), Math.round(height), language, state.visited].join('/');
  if (mat.firstChild && mapSizing === key) return;
  mapSizing = key;
  const focusId = mat.contains(document.activeElement) ? document.activeElement.getAttribute('href') : null;
  mat.innerHTML = atlasMap(narrow.matches, state.visited, height / width);
  if (focusId) mat.querySelector(`a[href="${focusId}"]`)?.focus({ preventScroll: true });
  mapObserver?.disconnect();
  mapObserver = new ResizeObserver(fitMap);
  mapObserver.observe(mat);
}
function mapTransition(id) {
  if (reduced.matches) return null;
  const mat = document.querySelector('.map-mat'),
    pin = mat?.querySelector(`a[href="#${id}"]`);
  if (!pin) return null;
  const screen = mat.getBoundingClientRect(),
    p = pin.getBoundingClientRect();
  return {
    svg: mat.firstElementChild,
    screen,
    x: (100 * (p.x + p.width / 2 - screen.x)) / screen.width,
    y: (100 * (p.y + p.height / 2 - screen.y)) / screen.height
  };
}
function enterStop(transition) {
  if (!transition) return;
  const { svg, screen, x, y } = transition,
    ghost = document.createElement('div');
  ghost.className = 'map-zoom';
  ghost.setAttribute('aria-hidden', 'true');
  ghost.inert = true;
  Object.assign(ghost.style, {
    left: screen.x + 'px',
    top: screen.y + 'px',
    width: screen.width + 'px',
    height: screen.height + 'px'
  });
  svg.style.transformOrigin = `${x}% ${y}%`;
  svg.querySelectorAll('a').forEach((a) => a.removeAttribute('href'));
  ghost.appendChild(svg);
  document.body.appendChild(ghost);
  const movement = svg.animate(
    [
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(1.22)', opacity: 0.89, offset: 0.35 },
      { transform: 'scale(1.85)', opacity: 0 }
    ],
    { duration: 420, easing: 'cubic-bezier(.34,.05,.4,1)', fill: 'forwards' }
  );
  movement.onfinish = () => ghost.remove();
  movement.oncancel = () => ghost.remove();
}
function returnToMap() {
  if (reduced.matches || state.visited < 0) return;
  const back = mapTransition(STORIES[state.visited].id);
  if (!back) return;
  back.svg.style.transformOrigin = `${back.x}% ${back.y}%`;
  back.svg.animate(
    [
      { transform: 'scale(1.32)', opacity: 0.45 },
      { transform: 'scale(1)', opacity: 1 }
    ],
    { duration: 330, easing: 'ease-out' }
  );
}
function render(focus = false) {
  document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
  document.title =
    state.view === 'watch'
      ? `${getStory().name} · RSI Atlas`
      : l(T('递归自我改进图谱 · RSI Atlas', 'Recursive Self-Improvement Atlas'));
  $('app').innerHTML = head() + (state.view === 'map' ? mapScreen() : watchScreen());
  paintFilm = null;
  lastBeat = -1;
  if (state.view === 'watch') renderStage();
  else fitMap();
  if (focus) $('content').focus({ preventScroll: true });
}
function renderStage() {
  const s = getStory(),
    film = makeFilm(s, state.choices[s.id], narrow.matches);
  $('stage').innerHTML = film.svg(s);
  paintFilm = bindFilm($('stage').firstElementChild, film);
  lastBeat = -1;
  paint();
  showPlay();
}
function paint() {
  if (!paintFilm) return;
  const k = phase(state.t);
  paintFilm(reduced.matches ? k + 0.94 : state.t);
  const slider = $('seek');
  slider.value = String(Math.round(state.t * 1000));
  slider.style.setProperty('--position', `${state.t * 25}%`);
  if (lastBeat === k) return;
  lastBeat = k;
  const s = getStory();
  $('beat-number').textContent = `${k + 1} / 4`;
  $('caption').textContent = l(caption(s, k));
  slider.setAttribute('aria-valuetext', `${k + 1} / 4 · ${l(stepName(s, k))}`);
  document.querySelectorAll('[data-beat]').forEach((b, i) => {
    if (i === k) b.setAttribute('aria-current', 'step');
    else b.removeAttribute('aria-current');
  });
}
function showPlay() {
  const b = $('transport-play');
  if (!b) return;
  const ended = state.t >= 4;
  const label = state.playing
    ? T('暂停动画', 'Pause animation')
    : ended
      ? T('重播动画', 'Replay animation')
      : T('播放动画', 'Play animation');
  b.innerHTML = icon(state.playing ? 'pause' : ended ? 'replay' : 'play');
  b.setAttribute('aria-label', l(label));
  b.title = l(label);
}
function halt() {
  cancelAnimationFrame(animId);
  animId = 0;
  lastTick = 0;
  state.playing = false;
  showPlay();
}
function tick(now) {
  if (!state.playing) return;
  if (lastTick) state.t = Math.min(4, state.t + Math.max(0, now - lastTick) / BEAT_MS);
  lastTick = now;
  paint();
  if (state.t >= 4) {
    if (state.tour && state.idx < STORIES.length - 1) {
      navigate(STORIES[state.idx + 1].id, { tour: true, play: true, replace: true, focus: false });
    } else {
      halt();
      state.tour = false;
    }
    return;
  }
  animId = requestAnimationFrame(tick);
}
function play() {
  if (state.view !== 'watch' || panel || state.playing) return;
  if (state.t >= 4) state.t = 0;
  state.playing = true;
  lastTick = 0;
  paint();
  showPlay();
  animId = requestAnimationFrame(tick);
}
function togglePlay() {
  if (state.playing) halt();
  else play();
}
function seekTime(t) {
  halt();
  state.tour = false;
  state.t = Math.max(0, Math.min(4, t));
  paint();
  showPlay();
}
function setHash(id, replace = false) {
  const u = new URL(location.href);
  u.hash = id === 'atlas' ? 'atlas' : id;
  if (u.href !== location.href) history[replace ? 'replaceState' : 'pushState'](null, '', u);
}
function navigate(
  id,
  { tour = false, play: auto = !reduced.matches, replace = false, focus = true, historyUpdate = true } = {}
) {
  document.querySelector('.map-zoom')?.remove();
  id = canonical(id);
  const fromMap = state.view === 'map',
    cameFromWatch = state.view === 'watch';
  const zoom = fromMap && STORIES.some((s) => s.id === id) ? mapTransition(id) : null;
  mapObserver?.disconnect();
  if (panel) closePanel(false);
  halt();
  const idx = STORIES.findIndex((s) => s.id === id);
  state.tour = tour;
  state.t = reduced.matches ? 0.94 : 0;
  if (idx >= 0) {
    state.view = 'watch';
    state.idx = idx;
    state.visited = idx;
  } else {
    state.view = 'map';
    state.tour = false;
  }
  if (historyUpdate) setHash(idx < 0 && id !== 'compare' ? 'atlas' : id, replace);
  render(focus);
  if (zoom) enterStop(zoom);
  else if (cameFromWatch && state.view === 'map') returnToMap();
  if (id === 'compare') openPanel('compare');
  else if (idx >= 0 && auto) play();
}
function station(diff) {
  const n = state.idx + diff;
  if (n < 0) return;
  navigate(n >= STORIES.length ? 'atlas' : STORIES[n].id);
}
const FIELDS = [
  T('反馈来自哪里', 'Feedback'),
  T('下一轮继承什么', 'What persists'),
  T('谁提出修改', 'Who edits'),
  T('怎样检验改进者', 'Evidence about the improver')
];
const original = (id, name) =>
  `<a class="source" href="https://arxiv.org/abs/${esc(id)}" target="_blank" rel="noopener noreferrer">${esc(name)} ${icon('out')}</a>`;
function experimentalData() {
  const c = MEDICAL_CONTROLS[state.solver];
  const role = (r) => (r === 'base' ? 'Base agent' : 'GRPO Solver');
  const names = [
    T('Solver 单独运行', 'Solver alone'),
    T('GRPO Improver 的 Harness', 'Harness by GRPO Improver'),
    T('MedicalRSI 的 Harness', 'Harness by MedicalRSI')
  ];
  return `<section class="results"><h3>${B('图 5a · 固定 Solver，更换 Harness 写作者', 'Figure 5a · Fix the solver and change the harness writer')}</h3><label>${B('选择 Solver', 'Choose solver')}<select id="solver">${MEDICAL_CONTROLS.map((o, i) => `<option value="${i}" ${state.solver === i ? 'selected' : ''}>${esc(o.backbone + ' · ' + role(o.role))}</option>`).join('')}</select></label><div class="bars">${c.scores.map((n, i) => `<div><span>${esc(l(names[i]))}</span><i><u style="width:${n}%"></u></i><b>${n}%</b></div>`).join('')}</div><p><strong>+${c.gain.toFixed(1)} ${B('个百分点', 'pp')}</strong> ${B('为原图标注的配对差值；柱上百分数按原图取整。', 'is the figure’s paired difference. Bar labels use its rounded percentages.')}</p></section>`;
}
function notesPanel() {
  const s = getStory();
  return `<div class="panel-top"><div><div class="reference">${esc(s.author)} · ${s.year}</div><h2 id="panel-title">${esc(s.name)}</h2></div><button class="round" data-close aria-label="${B('关闭笔记', 'Close notes')}">${icon('close')}</button></div><div class="notes-body"><h3>${esc(l(s.title))}</h3><p>${esc(l(s.body))}</p><h3>${B('证据与边界', 'Evidence and limits')}</h3><p>${esc(l(s.evidence))}</p><p>${esc(l(s.boundary))}</p>${s.id === 'medicalrsi' ? experimentalData() : ''}<div class="paper-source">${original(s.arxiv, l(s.id === 'base-agent' ? T('阅读 MedicalRSI', 'Read MedicalRSI') : T('阅读原论文', 'Read the paper')))}<span>${esc(l(s.locator))}</span></div>${s.aside ? `<h3>${B('相关论文', 'Companion paper')} · ${esc(s.aside.name)}</h3><p>${esc(l(s.aside.text))}</p>${original(s.aside.arxiv, s.aside.name)}` : ''}</div>`;
}
function comparePanel() {
  const selected = state.pair.map(paper);
  return `<div class="panel-top"><h2 id="panel-title">${B('论文对照', 'Compare papers')}</h2><button class="round" data-close aria-label="${B('关闭对照', 'Close comparison')}">${icon('close')}</button></div><p class="compare-intro">${B('Solver 负责解题，Improver 负责提出改动。两者可以共用模型。图谱把「反馈改变了下一轮提出改动的策略」作为识别递归的一条线索。', 'The solver does the task and the improver proposes edits. They can share a model. This atlas tracks recursion by asking whether feedback changes the strategy that proposes the next edit.')}</p><div class="pair-picker">${selected
    .map(
      (s, i) =>
        `<label>${i === 0 ? B('左侧论文', 'Left paper') : B('右侧论文', 'Right paper')}<select data-pair="${i}">${STORIES.slice(
          1
        )
          .map((v) => `<option value="${v.id}" ${v.id === s.id ? 'selected' : ''}>${esc(v.name)}</option>`)
          .join('')}</select></label>`
    )
    .join(
      ''
    )}</div><div class="comparisons">${FIELDS.map((v, i) => `<div class="field"><h3>${esc(l(v))}</h3><div>${selected.map((s) => `<p>${esc(l(s.fields[i]))}</p>`).join('')}</div></div>`).join('')}</div><div class="paper-source">${selected.map((s) => original(s.arxiv, s.name)).join('')}</div>`;
}
function paintPanel(restore = null) {
  $('panel-content').innerHTML = panel === 'notes' ? notesPanel() : comparePanel();
  if (restore) $('drawer').querySelector(restore)?.focus({ preventScroll: true });
}
function openPanel(mode, trigger = null) {
  if (panel || (mode === 'notes' && state.view !== 'watch')) return;
  panel = mode;
  panelOpener = trigger || document.activeElement;
  resumeAfterPanel = state.playing;
  halt();
  paintPanel();
  $('drawer').showModal();
  $('drawer').querySelector('[data-close]').focus({ preventScroll: true });
}
function closePanel(resume = true) {
  if (!panel) return;
  panel = null;
  $('drawer').close();
  if (resume && hashId() === 'compare') setHash(state.view === 'watch' ? getStory().id : 'atlas', true);
  if (resume && panelOpener?.isConnected) panelOpener.focus({ preventScroll: true });

  resumeAfterPanel = false;
  panelOpener = null;
}
function changeLanguage(next) {
  if (next === language) return;
  const running = state.playing;
  halt();
  language = next;
  store('rsi-atlas-lang', next);
  const u = new URL(location.href);
  u.searchParams.set('lang', next);
  history.replaceState(null, '', u);
  render();

function selectChoice(choice) {
  const s = getStory(),
    v = OPTIONS[s.id];

  state.choices[s.id] = choice;
  state.t = v.phase + (reduced.matches ? 0.94 : 0);

    .querySelectorAll('[data-choice]')

document.addEventListener('click', (e) => {
  document.querySelector('.map-zoom')?.remove();
  const n = e.target.closest('a,button');
  if (!n) {
    if (e.target === $('drawer')) {
      const r = $('drawer').getBoundingClientRect();

  }
});
document.addEventListener('input', (e) => {

});
document.addEventListener('change', (e) => {
  if (e.target.id === 'solver') {

    paintPanel('#solver');
  }
  if (e.target.matches('[data-pair]')) {
    const i = Number(e.target.dataset.pair);

  }

$('drawer').addEventListener('cancel', (e) => {
  e.preventDefault();
  closePanel();
});
document.addEventListener('keydown', (e) => {
  if (panel || e.altKey || e.metaKey || e.ctrlKey || e.target.matches('input,select,textarea')) return;
  if (state.view !== 'watch') return;
  if (e.key === 'Escape') {
    e.preventDefault();
    navigate('atlas');
  } else if (e.code === 'Space' && !e.target.closest('button,a')) {

window.addEventListener('hashchange', () => navigate(hashId(), { historyUpdate: false }));

  }

navigate(hashId(), { focus: false, historyUpdate: false });
