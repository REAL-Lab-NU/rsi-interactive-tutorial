:root {
  --page:#fcfafb; --surface:#fff; --band:#f7f3f6; --ink:#2a2430; --muted:#615867; --line:#e4dce4; --dot:#e7dce5;
  --rose:#9b2c4e; --rose-wash:#f9e3ec; --pink:#e8a9c0; --teal:#106b67; --teal-wash:#dcefea; --violet:#5e3a9e; --violet-wash:#eae2f4;
  --ink-shadow:#332a37; --button-text:#fff; --sans:'Nunito','Atlas Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --display:'Comic Neue','Nunito','Atlas Sans','PingFang SC','Microsoft YaHei',sans-serif; --mono:ui-monospace,'SFMono-Regular',Consolas,'Atlas Sans',monospace;
  color-scheme:light;
}
:root[data-theme="dark"] {
  --page:#19151d; --surface:#251f2a; --band:#211b25; --ink:#f5eef5; --muted:#cec0ce; --line:#463b49; --dot:#382e3c;
  --rose:#f2add0; --rose-wash:#452637; --pink:#88506b; --teal:#85d9d0; --teal-wash:#203936; --violet:#d2baf4; --violet-wash:#382b4a;
  --ink-shadow:#0d0910; --button-text:#341526; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:78px;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:600 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,a,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:inherit;text-underline-offset:.2em}
button{border:0;background:transparent}h1,h2,h3,p,figure{margin:0}h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.015em}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
svg{display:block;width:100%;height:auto}svg text{font-family:var(--sans)}a,button,summary{-webkit-tap-highlight-color:transparent}
.wrap{width:min(1168px,calc(100% - 72px));margin-inline:auto}
.mast{position:sticky;top:0;z-index:12;border-bottom:1px solid var(--line);background:var(--page)}
.mast-inner,.mast nav,.brand,.nav-tools{display:flex;align-items:center}.mast-inner{min-height:66px;justify-content:space-between;gap:22px}
.brand{gap:10px;text-decoration:none;color:var(--rose);font:700 26px/1.12 var(--display);white-space:nowrap}.brand svg{width:48px;height:40px;flex:none}
.mast nav{gap:20px}.mast nav button,.mast nav a{font-size:15px;font-weight:800;line-height:1.25}.mast nav a,.mast nav button{text-decoration:none;color:var(--muted)}
.mast nav a:hover,.mast nav button:hover{color:var(--rose)}.icon{width:18px;height:18px;display:inline-block;vertical-align:-3px;margin-right:6px;flex:none}
#language-link{padding:5px 11px;border-radius:14px;background:var(--rose-wash);color:var(--rose);white-space:nowrap}
#theme-button{display:grid;place-items:center;width:36px;height:36px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink)}
#theme-button svg{width:19px;height:19px}.sun-icon,[data-theme="dark"] .moon-icon{display:none}[data-theme="dark"] .sun-icon{display:block}
.hero,.chapter-head-band{background-color:var(--page);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:20px 20px}
.hero-grid{display:grid;grid-template-columns:minmax(0,.93fr) minmax(0,1.07fr);align-items:center;gap:clamp(35px,4.2vw,70px);padding-block:clamp(46px,5vw,78px)}
.hero-copy{max-width:535px}.term,.kicker,.action-label{color:var(--rose);font:800 12px/1.4 var(--sans);letter-spacing:.11em;text-transform:uppercase}
.term,.kicker{display:flex;align-items:center;gap:9px}.term svg,.kicker svg{width:19px;height:19px}.hero h1{color:var(--rose);font-size:clamp(49px,5.25vw,79px);line-height:1.01;margin:17px 0 20px;letter-spacing:-.035em}
html[lang="zh-CN"] .hero h1{font-size:clamp(42px,4.6vw,64px);line-height:1.2;letter-spacing:-.04em}
.hero-lead{font-size:clamp(19px,1.75vw,25px);font-weight:850;line-height:1.33;max-width:24em}.hero-body{margin-top:13px;max-width:38em;color:var(--muted);font-size:clamp(16px,1.23vw,19px);line-height:1.65}
.hero-body strong{color:var(--ink);font-weight:800;background:linear-gradient(transparent 68%,var(--rose-wash) 68%)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hero .actions{margin-top:25px}
.primary,.quiet{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:8px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:2.5px 3px 0 var(--ink-shadow);font:800 15px/1.25 var(--sans);padding:9px 16px;min-height:40px;transition:transform .15s,box-shadow .15s}
.primary{background:var(--rose);border-color:var(--rose);color:var(--button-text)}.primary:hover,.quiet:hover{box-shadow:3.5px 4px 0 var(--ink-shadow)}.primary:active,.quiet:active{box-shadow:1px 1px 0 var(--ink-shadow)}
.actions .ui-glyph{width:18px;display:inline-block;flex:none}.arr{font-weight:850}
.demo-card{min-width:0;overflow:hidden;border:2px solid var(--ink);border-radius:22px;background:var(--surface);box-shadow:6px 6px 0 var(--pink)}
.window-bar,.plate-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rose-wash);border-bottom:1px solid var(--line);padding:10px 17px}
.window-left{display:flex;gap:10px;align-items:center;min-width:0}.window-left h2,.plate-head strong{font:700 18px/1.3 var(--display);color:var(--ink)}
.lights{display:inline-flex;gap:3px;flex-shrink:0}.lights i{display:block;width:7px;height:7px;border-radius:50%;background:#dc9cb5}.lights i:nth-child(2){background:#d5bd85}.lights i:nth-child(3){background:#91c5b8}
.demo-count{font:750 11px/1.2 var(--mono);color:var(--rose);white-space:nowrap}
.demo-diagram{background:#fffafd;border-bottom:1px solid var(--line)}.demo-scene{max-height:233px}.role-label{font-family:var(--display);font-weight:700}.tiny-path{stroke-dasharray:5 5;animation:travel .8s ease-out 1}
.actor-active .actor-frame{stroke-width:2.5}.actor-active .state-pin{animation:settle .35s ease-out both;transform-box:fill-box;transform-origin:center}
.demo-data{padding:13px 20px 17px}.scores{display:grid;gap:5px;margin-bottom:10px}.score-row{display:grid;grid-template-columns:116px minmax(48px,1fr) 43px;align-items:center;gap:12px;font-size:13px;font-weight:750;color:var(--muted)}
.score-track{height:13px;border:1px solid #b5a9b5;border-radius:3px;position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%);overflow:hidden}
.score-fill{display:block;height:100%;border-right:1.5px solid #443347;background:repeating-linear-gradient(130deg,transparent 0,transparent 4px,#45293740 4px,#45293740 5.5px),#e9b0c7;transition:width .5s ease}.score-row[data-series="before"] .score-fill{background:#b7d0e2}.score-row[data-pending="true"] .score-track{border-style:dashed}
.score-value{font:750 12px/1.1 var(--mono);white-space:nowrap;color:var(--ink)}.demo-description{color:var(--muted);font-size:14px;line-height:1.5;min-height:3em}.demo-actions{margin-top:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.demo-actions .primary,.demo-actions .quiet{padding:7px 14px;font-size:13px;min-height:34px}
.chapter-band{background:var(--surface);border-top:1px solid var(--line);padding-block:32px 42px;scroll-margin-top:76px}.section-head{display:flex;align-items:center;gap:11px;margin-bottom:18px}.section-head h2{font-size:clamp(25px,2.5vw,36px);line-height:1.18}.section-head .ui-glyph{width:24px;color:var(--rose)}
.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 22px}.chapter-card{--tile:#f9e3ec;display:flex;align-items:center;gap:13px;min-height:87px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--page);text-decoration:none;transition:transform .18s,border-color .18s,background .18s;min-width:0}.chapter-card:hover{border-color:var(--rose);background:var(--surface);box-shadow:1.5px 2px 0 var(--pink)}
.chapter-card:nth-child(2){--tile:#e4def2}.chapter-card:nth-child(3){--tile:#d6ede5}.chapter-card:nth-child(4){--tile:#deebf6}.chapter-card:nth-child(5){--tile:#f7e7c2}.chapter-card:nth-child(6){--tile:#eadcf0}
.card-icon{width:53px;height:53px;flex:none;background:var(--tile);border-radius:15px;padding:7px}.card-copy{min-width:0}.card-copy h3{font-size:20px;line-height:1.2}.card-copy p{font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}

<script id="experiment-model">
"use strict";
// Each track describes the events available to a reader. A write and a one-off correction lead to different later runs.
const tracks = {
  trace: {
    start:'question', states:{
      question:{plan:'plan'}, plan:{observe:'observation'}, observation:{answer:'reply'}, reply:{restart:'question'},
    },
  },
  si: {
    start:'attempt', states:{
      attempt:{inspect:'feedback'}, feedback:{propose:'proposal'}, proposal:{install:'installed',once:'temporary'},
      installed:{test:'inherited'}, temporary:{test:'forgotten'}, inherited:{restart:'attempt'}, forgotten:{restart:'attempt'},
    },
  },
  rsi: {
    start:'original', states:{
      original:{inspect:'failure'}, failure:{learn:'learned'}, learned:{apply:'suggestions'},
      suggestions:{evaluate:'comparison'}, comparison:{restart:'original'},
    },
  },
};
function advance(track, state, event) {
  const transitions=tracks[track].states[state];
  return Object.hasOwn(transitions,event) ? transitions[event] : state;
}

// The records are simulated tool results. Expected rooms are independently specified in each fixture.
// A larger revision means a later calendar edit. The day identifies the occurrence of a recurring event.
function meeting(id, title, day, expected, rows) {
  return {id,title,day,expected,records:rows.map(([day,revision,room])=>({title,day,revision,room}))};
}
const agenda = {
  intro:meeting('intro','reading','thu','C03',[['thu',1,'B12'],['thu',2,'C03']]),
  next:[
    meeting('next-1','film','mon','A11',[['mon',1,'B14'],['mon',2,'A11']]),
    meeting('next-2','robotics','tue','D04',[['tue',3,'D04'],['tue',1,'A08']]),
    meeting('next-3','music','wed','C17',[['wed',1,'C17']]),
    meeting('next-4','debate','fri','B05',[['fri',1,'D12'],['fri',2,'B05']]),
  ],
  // The Improver observes the outcome of its own earlier proposal on this workflow.
  learning:[meeting('learn-1','writing','thu','D10',[['thu',1,'B08'],['thu',2,'D10'],['fri',3,'F21']])],
  // Both Improvers receive these same two traces before each proposes a single change to a fresh Solver.
  support:[
    meeting('support-1','drawing','mon','C20',[['tue',3,'B19'],['mon',2,'C20']]),
    meeting('support-2','dance','fri','E06',[['fri',1,'B21'],['fri',2,'E06']]),
  ],
  heldOut:{
    mixed:[
      meeting('mixed-1','design','wed','D02',[['wed',1,'A07'],['wed',2,'D02']]),
      meeting('mixed-2','poetry','thu','C09',[['thu',1,'A09'],['thu',2,'C09'],['fri',3,'F01']]),
      meeting('mixed-3','chess','mon','A15',[['mon',3,'A15'],['tue',2,'H11']]),
      meeting('mixed-4','choir','tue','B07',[['wed',4,'F08'],['tue',2,'B07']]),
    ],
    single:[
      meeting('single-1','photo','mon','E03',[['mon',1,'D11'],['mon',2,'E03']]),
      meeting('single-2','book','tue','B04',[['tue',4,'B04'],['tue',1,'A03']]),
      meeting('single-3','math','thu','C07',[['thu',1,'C11'],['thu',2,'C07']]),
      meeting('single-4','art','fri','A04',[['fri',1,'A04']]),
    ],
  },
};
function runSolver(task, rule='first') {
  const hits=task.records.filter(record=>record.title===task.title);
  const options=rule==='datedLatest' ? hits.filter(record=>record.day===task.day) : hits;
  const selected=rule==='first' ? options[0] : options.reduce((best,record)=>!best||record.revision>best.revision?record:best,null);
  return {task, selected, room:selected?.room??null, correct:selected?.room===task.expected};
}
function correctCount(tasks, rule) {
  return tasks.reduce((n,task)=>n+Number(runSolver(task,rule).correct),0);
}
function installedRule(state) {
  return ['installed','inherited'].includes(state) ? 'latest' : 'first';
}
const originalImprover={checksDay:false};
function wrongDay(trace) {
  return Boolean(!trace.correct && trace.selected && trace.selected.day!==trace.task.day);
}
function learnFromOutcomes(improver, outcomes) {
  const useful=outcomes.some(trace=>wrongDay(trace) && runSolver(trace.task,'datedLatest').correct);
  return useful ? {checksDay:true} : improver;
}
function proposeRule(improver, traces) {
  return improver.checksDay && traces.some(wrongDay) ? 'datedLatest' : 'latest';
}
function studyImprovers() {
  const earlierRule=proposeRule(originalImprover,[runSolver(agenda.intro)]);
  const outcomes=agenda.learning.map(task=>runSolver(task,earlierRule));
  const revised=learnFromOutcomes(originalImprover,outcomes);
  const traces=agenda.support.map(task=>runSolver(task));
  return {outcomes,revised,oldRule:proposeRule(originalImprover,traces),newRule:proposeRule(revised,traces)};
}
</script>

  {id:'harness',icon:'layers',short:['Harness','Harness'],title:['拆开 model 和 harness','Look inside the model and harness'],summary:['点开上下文、记忆、技能、工具和代码','Inspect context, memory, skills, tools, and code'],intro:['Model 是根据输入选择工具或生成回答的模型。Harness 是围绕模型工作的程序和资源。点开一个部件，看看它在查教室时负责什么。','The model selects an action or writes a reply from its input. The harness is the surrounding software and resources. Select a component to see its part in finding the room.'],figure:['日历 agent 的组成','Inside the calendar agent'],hint:['点图里的部件可以展开。','Select any component in the diagram.'],research:['这里采用较宽的 harness 定义，包括组织上下文的代码和代码管理的资源。不同系统可以只使用其中几项，记忆、技能和提示在具体实现中也可能共用一种存储。','We use harness for both the surrounding code and the resources it manages. A system may use only some of these parts. A memory, a skill, and a prompt can share a storage format.'],refs:['guide','agents','meta']},
  {id:'evolution',icon:'edit',short:['进化对象','What evolves'],title:['经验可以改到哪里？','Where can experience go?'],summary:['沿一项真实研究，找到留下的改变','Trace a real method to the artifact it changes'],intro:['同样是从失败中学习，下一次运行可以换一组权重、读一条记忆、执行新技能，或者走一段新代码。选一种方法追踪它的改动。','Learning from a failure can leave new weights, a memory, a reusable skill, or different code. Choose a research method and follow the change into the next run.'],figure:['一次更新留下什么','What survives an update'],hint:['切换研究方法，看反馈写进哪个部件。','Change methods to see where the feedback is written.'],research:['这些是按主要更新对象做的切片。同一方法可以同时修改多个部件。SEAL 还用下游表现学习生成自编辑指令，MedicalRSI 会联合更新模型并保留有效的 harness。','Each view identifies one major update target. A method can change several. SEAL also learns to generate useful self-edits from downstream performance. MedicalRSI updates its model and retains useful harnesses.'],refs:['seal','medical','guide']},
  {id:'si',icon:'return',short:['自我改进','SI'],title:['一次纠错怎样成为自我改进？','When does a correction become self-improvement?'],summary:['选择由谁修改，再用新问题检验','Choose who edits, then try fresh questions'],intro:['把做任务的角色叫 Solver，把根据反馈提出改动的角色叫 Improver。它们可以由同一 agent 扮演，也可以由外部 agent 帮忙。亲手决定这次改动能否传给下次任务。','Call the task-solving role the Solver and the role that proposes changes the Improver. One agent can fill both roles, or another agent can help. Decide what the next task inherits.'],figure:['谁把经验写回 Solver','Who writes back to the Solver?'],hint:['两条分支使用相同的新问题，可以重跑比较。','Replay both branches on identical fresh questions.'],research:['《Understanding RSI》把自身、教师和联合更新都纳入较宽的自进化范围。Meta-Harness 展示了外部提议者如何从执行记录搜索任务 harness。若把边界只画在 Solver 外，外部改动可称为教师驱动的适应，把双方圈入同一系统，就是系统级的自我改进。','Understanding RSI includes self, teacher, and joint updates in a broad family of self-evolution. Meta-Harness illustrates an outer proposer searching task harnesses from traces. An external edit is teacher-driven adaptation from the Solver’s perspective and system-level self-improvement when both roles are inside the boundary.'],refs:['guide','meta','refine']},
  {id:'rsi',icon:'recursive',short:['递归改进','RSI'],title:['Improver 怎样学会更好的改法？','How does the Improver learn to improve?'],layers:['改进者也有 model 和 harness。MedicalRSI 让候选的效果参与训练共享模型，Hyperagents 让改进程序本身可编辑。两条路径都可以改变未来怎样产生修改。把新版与旧版放到相同的新任务上，才有依据判断这种改变带来了多少增益。','An Improver also has a model and a harness. In MedicalRSI, candidate outcomes help train the shared model. Hyperagents can edit the improvement program itself. Either route can change how future edits are produced. Compare old and new versions on the same fresh tasks to measure the gain from that change.'],summary:['同一起点，比较两代改进策略','Give two generations of Improver the same start'],intro:['先让 Improver 看见自己的上一次建议造成了什么后果，再让它更新诊断方法。最后，把两代 Improver 交给相同的新 Solver，比较它们各自带来的增益。','Let the Improver see what its previous suggestion actually did. It can then revise how it diagnoses failures. Give both generations the same fresh Solver and measure the gain from their edits.'],figure:['从 Solver 的反馈到 Improver 的更新','From a Solver outcome to an Improver update'],hint:['最后可更换测试集，并逐题查看两种建议的效果。','At the end, switch test sets and inspect both proposals question by question.'],research:['MedicalRSI 的 Solver 与 Improver 共享模型，候选 harness 的收益给 Improver 提供学习信号。Hyperagents 允许 meta agent 修改自己的程序。这里用一条可修改的诊断规则演示这个因果关系，日历数据和分数均为教学示例。','MedicalRSI shares one model between Solver and Improver and uses the gain from a candidate harness as a learning signal. Hyperagents makes the meta agent’s program editable. Our calendar experiment demonstrates the causal connection with an editable diagnostic rule and illustrative data.'],refs:['medical','hyper','stop']},
  {id:'limits',icon:'network',short:['边界案例','Edge cases'],title:['两种角色能解释所有方法吗？','How far can two roles take us?'],summary:['用真实论文检验这张图的边界','Test the picture against real research systems'],intro:['读一篇方法论文时，可以先问谁做题、谁提出改动。再圈出真正被更新的东西、反馈来自哪里，以及它能否影响下一轮。选一个案例看看图会怎么变。','Start by asking who solves the task and who proposes a change. Then mark what gets updated, where feedback comes from, and what carries into the next round. Select a case to see the diagram change.'],figure:['文献里的不同连接方式','How the roles connect in the literature'],hint:['选择案例，观察角色、产物与反馈之间的关系。','Select a case to trace the roles, artifacts, and feedback.'],research:['《Understanding RSI》用 RSI 指经历反馈后可持续更新的系统。本教程在区分 SI 与 RSI 时沿用 MedicalRSI 的较窄口径，即产生未来改动的策略也能从结果中学习。阅读其他论文时应先核对作者的定义。','Understanding RSI uses RSI broadly for systems that carry feedback-driven updates into later tasks. When distinguishing SI from RSI, this tutorial follows the narrower MedicalRSI usage, where the strategy for making future improvements also learns from outcomes. Check each paper’s definition.'],refs:['guide','medical','hyper']},
];

const cases=[
 {id:'outer',short:['外部提议者','Outer proposer'],ref:'meta',title:['外部 agent 改 Solver 的 harness','An external agent edits the Solver’s harness'],detail:['Meta-Harness 的提议者能查不断增长的历史档案。论文主要检验找到的任务 harness。要进一步归因到改进策略本身，可以让早期和后期提议者在同样的新起点上接受检验。','The Meta-Harness proposer can consult a growing archive. The paper primarily evaluates discovered task harnesses. To isolate a change in the improving strategy, evaluate earlier and later proposers from the same fresh starting point.'],lesson:['先画清系统边界，再说是谁在自我改进。','Mark the system boundary before saying who self-improves.']},
 {id:'shared',short:['共享模型','Shared model'],ref:'medical',title:['一个模型，两个角色','One model plays both roles'],detail:['MedicalRSI 的同一组权重既做题，也提出 harness。Solver 得到任务反馈，Improver 得到候选带来的增益。若要单独测 Improver 的贡献，可固定接受修改的 Solver。','MedicalRSI uses shared weights to solve tasks and propose harnesses. The Solver receives task feedback and the Improver receives the gain from a candidate. Holding the receiving Solver fixed helps isolate the Improver’s contribution.'],lesson:['两个角色可以共享一个模型。','Two roles can share one model.']},
 {id:'self',short:['可编辑的改进者','Editable improver'],ref:'hyper',title:['生成修改的程序也可修改','The edit-making procedure can edit itself'],detail:['Hyperagents 把 task agent 和 meta agent 放在同一个可编辑程序内。meta agent 可以修改两者，保留的新程序能改变未来如何搜索、记录和提出修改。','Hyperagents puts a task agent and a meta agent in an editable program. The meta agent can modify both. Retained changes can alter how future agents search, record, and propose edits.'],lesson:['看修改是否回流到下一轮的改进方法。','Trace an edit back into the next round’s improving procedure.']},
 {id:'stop',short:['固定底层模型','Fixed model'],ref:'stop',title:['改进程序可以进化，模型权重仍固定','The improver program evolves with fixed weights'],detail:['STOP 让改进程序修改自己的脚手架，再用新版去改其他程序。作者观察到下游收益，同时因为底层语言模型固定，保留了对“完整 RSI”的更严格用法。这个例子把两种定义的差异摆到台面上。','STOP applies an improver to its own scaffolding and then uses the resulting version on other programs. The authors report downstream gains and reserve full RSI for a stronger condition because the underlying language model stays fixed. Here the definition changes the classification.'],lesson:['说明你所说的 RSI 是否包括只改 harness 的情形。','Specify whether harness-only recursion counts under your definition.']},
 {id:'answer',short:['只改答案','One answer'],ref:'refine',title:['循环发生在同一道题里','The loop can stay inside one task'],detail:['Self-Refine 让同一模型生成、批评并修改当前输出。下一题能否继承任何东西，是另一个需要检查的问题。','Self-Refine uses the same model to draft, critique, and revise its current output. Whether a new task inherits any change is a separate question.'],lesson:['追踪会话结束后留下的产物。','Follow the artifact across the session boundary.']},
 {id:'population',short:['多个版本','Population'],ref:'dgm',title:['一整组 Solver 可以同时留下来','An archive can keep many Solvers'],detail:['Darwin Gödel Machine 保留可继续修改的编码 agent 版本。选择不同父版本能产生不同后代。一个 Solver 框可以缩写这一组，但会隐藏谱系和选择过程。','The Darwin Gödel Machine retains coding-agent variants that can be modified further. Different parents produce different descendants. A single Solver box hides the archive and its selection process.'],lesson:['版本有分支时，把档案和选择器画出来。','Draw the archive and selector when versions branch.']},
 {id:'program',short:['普通程序','Plain program'],ref:'alpha',title:['被改的东西可以是一段算法','The thing being improved can be an algorithm'],detail:['AlphaEvolve 的模型提出代码，评估器给变体评分，搜索产生更好的目标程序。这里的被改对象可以是一段普通算法。描述全貌还需要候选池与独立评估器。','AlphaEvolve uses models to propose code, evaluators to score variants, and search to improve target programs. The target can be an ordinary algorithm. The candidate pool and independent evaluators are also part of the picture.'],lesson:['把 Solver 推广为被改对象，并单独画出评估器。','Generalize the Solver to a target artifact and show the evaluator separately.']},
 {id:'training',short:['训练程序','Training pipeline'],ref:'seal',title:['一个更新可以由模型和优化器分工','A model and an optimizer can share an update'],detail:['SEAL 的模型提出自编辑指令，微调程序执行权重更新，下游结果训练自编辑策略。把这一切画成第二个 agent 会隐藏真正执行更新的优化器。','In SEAL the model proposes a self-edit, fine-tuning applies the weight update, and downstream outcomes train the self-edit policy. Collapsing this into a second agent hides the optimizer that actually applies the edit.'],lesson:['区分提出改动、执行改动和评估效果。','Separate proposal, execution, and evaluation.']},
];

// The moving token follows the same path as the labelled event. Reduced-motion mode keeps the arrow and its active colour.
function arrow(label,direction='right',active=true,tone='mint') {
  const reverse=direction==='left',color=active?(tone==='lilac'?'#8058a0':tone==='pink'?'#aa436d':'#267e75'):'#a99cab';
  const d=reverse?'M91 12Q49 23 9 13':'M9 13Q50 3 91 12';
  const head=reverse?'m16 8-8 5 7 6':'m84 6 8 6-9 5';
  const token=active&&!motion.matches?`<circle r="3.5" fill="${color}" opacity="0"><animateMotion dur="1.05s" path="${d}"/><animate attributeName="opacity" dur="1.05s" values="0;1;1;0" keyTimes="0;0.08;0.9;1"/></circle>`:'';
  return `<div class="flow-arrow ${active?'carrying':''}"><span>${label}</span><svg viewBox="0 0 100 23" aria-hidden="true"><path d="${d}" stroke="${color}" stroke-width="2" fill="none" stroke-dasharray="${active?'4 2':'3 5'}"/><path d="${head}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${token}</svg></div>`;
}
function node(title,sub,kind,tone='mint',active=false) {
  return `<div class="draw-node tone-${tone}${active?' is-current':''}">${illustration(kind,tone)}<strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</div>`;
}
function board(content,cls='') {return `<div class="paper-board ${cls}">${content}</div>`;}
function windowBar(title,end='') {return `<div class="window-bar"><div class="window-left"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><h2>${title}</h2></div>${end}</div>`;}
function topology({left,right,forward,back,active='left',enclosure,annotate,reverseOn=false}) {
  return `<div class="topology"><div class="group-caption">${enclosure||''}</div><div class="paired">${node(...left,active==='left')}<div class="arrow-stack">${arrow(forward,'right',!reverseOn,'mint')}${back?arrow(back,'left',reverseOn,'pink'):''}</div>${node(...right,active==='right')}</div>${annotate?`<div class="board-line">${annotate}</div>`:''}</div>`;
}

function resultDetails(tasks,rules,names){
  const head=[t('问题','Question'),t('正确教室','Expected room'),...names];
  const rows=tasks.map(task=>`<tr><th scope="row">${l(days[task.day])} · ${l(titles[task.title])}</th><td>${task.expected}</td>${rules.map(rule=>{const r=runSolver(task,rule);return `<td class="${r.correct?'right-room':'wrong-room'}">${r.room}<span aria-hidden="true"> ${r.correct?'✓':'×'}</span><span class="sr"> ${r.correct?t('正确','Correct'):t('错误','Incorrect')}</span></td>`;}).join('')}</tr>`).join('');
  return `<details class="room-results"><summary>${t('查看逐题结果','See each question')}</summary><div class="table-scroll" tabindex="0" aria-label="${t('逐题对照表','Question-by-question results')}"><table><thead><tr>${head.map(s=>`<th scope="col">${s}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function siPanel(){
  const s=progress.si,owner=progress.owner,finished=['forgotten','inherited'].includes(s),step={attempt:1,feedback:2,proposal:3,installed:4,temporary:4,inherited:5,forgotten:5}[s];
  const events=Object.keys(tracks.si.states[s]);
  return choices(t('谁来提出修改？','Who proposes the edit?'),'owner',collections.owner.map(l),owner)+stepLine(step,5)+statusCard(...siCopy[s])+`<div class="actions">${events.map(key=>eventButton('si',key,siEvents[key],key!=='once')).join('')}</div>`+(finished?resultDetails(agenda.next,['first',installedRule(s)],[t('初版','Initial'),t('新版','Updated')]):'');
}
function rsiPanel(){
  const s=progress.rsi,step=Object.keys(tracks.rsi.states).indexOf(s)+1,event=Object.keys(tracks.rsi.states[s])[0],sample=progress.sample;
  let comparison='';
  if(s==='comparison'){
    const study=studyImprovers();comparison=choices(t('未用于提出建议的题集','Held-out test set'),'sample',collections.sample.map(l),sample)+resultDetails(agenda.heldOut[sampleIds[sample]],[study.oldRule,study.newRule],[t('旧提议','Old edit'),t('新提议','New edit')]);
  }
  return stepLine(step,5)+statusCard(...rsiCopy[s])+comparison+`<div class="actions">${eventButton('rsi',event,rsiEvents[event])}</div>`;
}
function casePanel(){const c=cases[progress.example];return choices(t('连接方式','Connection pattern'),'example',cases.map(it=>l(it.short)),progress.example)+statusCard(c.title,c.detail)+`<p class="readout">${l(c.lesson)}</p><div>${sourceLink(c.ref)}</div>`;}
const panels={agent:tracePanel,harness:anatomyPanel,evolution:methodsPanel,si:siPanel,rsi:rsiPanel,limits:casePanel};
const drawings={agent:()=>traceFigure(progress.trace),harness:()=>anatomyFigure(progress.part),evolution:()=>methodFigure(progress.method),si:()=>siFigure(progress.si,progress.owner),rsi:()=>rsiFigure(progress.rsi,sampleIds[progress.sample]),limits:()=>caseFigure(progress.example)};
function homeDemo(){const s=progress.trace,step=traceOrder.indexOf(s)+1;return windowBar(t('运行一个 base agent','Run a base agent'),`<span class="demo-count">${step} / 4</span>`)+traceFigure(s)+`<div class="demo-data"><p class="demo-description" id="demo-status">${l(traceInfo[s].body)}</p>${traceActions()}</div>`;}
function home(){
  const tiles=lessons.map((it,i)=>`<a class="chapter-card" href="#${it.id}"><span class="card-icon">${illustration(it.icon,['mint','lilac','pink','blue','gold','lilac'][i])}</span><div class="card-copy"><h3>${l(it.title)}</h3><p>${l(it.summary)}</p></div></a>`).join('');
  return `<section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><div class="kicker">${glyph('loop')}${t('AI 互动教程','Interactive AI tutorial')}</div><h1>${t('递归','Recursive')}<br><span>${t('自我改进','Self-Improvement')}</span></h1><p class="hero-lead">${t('一个 agent 怎样学会更好的改进方法？','How does an agent learn a better way to improve?')}</p><p class="hero-body">${t('从一次日历查询开始。先看模型怎样使用工具，再让反馈改写它的 harness。最后，亲手检验<strong>提出修改的 agent</strong> 有没有变强。','Start with a calendar lookup. Watch a model use a tool, then turn feedback into a harness edit. Finally, test whether <strong>the agent proposing the edits</strong> has improved.')}</p><div class="actions"><a class="primary" href="#agent">${glyph('play')}${t('从 base agent 开始','Start with the base agent')}</a><a class="quiet" href="#experiments">${glyph('grid')}${t('全部实验','All experiments')}</a></div></div><section class="demo-card" id="home-demo" aria-label="${t('在首页运行一次日历 agent','Run the calendar agent on this page')}">${homeDemo()}</section></div></section>
    <section class="chapter-band" id="experiments" aria-labelledby="experiments-title"><div class="wrap"><div class="section-head">${glyph('grid')}<h2 id="experiments-title" tabindex="-1">${t('六个实验，看懂 RSI','Explore six RSI experiments')}</h2></div><div class="chapter-grid">${tiles}</div></div></section>`;
}
function zoomLabel(){return zoomed?t('收起图 ↙','Reduce figure ↙'):t('放大图 ↗','Enlarge figure ↗');}
function lessonView(it){
  const index=lessons.indexOf(it),tabs=lessons.map(p=>`<a href="#${p.id}"${it===p?' aria-current="page"':''}>${l(p.short)}</a>`).join('');
  return `<section class="work"><div class="chapter-head-band"><div class="wrap"><div class="route-bar"><a href="#experiments" class="back">${t('← 全部实验','← All experiments')}</a><nav class="route-tabs" aria-label="${t('六个实验','Six experiments')}">${tabs}</nav></div><div class="chapter-heading"><div class="term">${glyph('loop')}${t('实验 '+(index+1)+' / 6','Experiment '+(index+1)+' of 6')}</div><h1 id="chapter-title" tabindex="-1">${l(it.title)}</h1><p>${l(it.intro)}</p></div></div></div>
    <div class="wrap workspace"><div class="bench${zoomed?' zoomed':''}"><figure class="plate"><figcaption class="plate-head"><div class="window-left"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><strong>${l(it.figure)}</strong></div><button type="button" class="zoom" data-zoom aria-pressed="${zoomed}">${zoomLabel()}</button></figcaption><div class="art" id="art" role="group" aria-label="${l(it.figure)}">${drawings[it.id]()}</div><div class="plate-foot">${l(it.hint)}</div></figure><section class="notes" id="note" aria-label="${t('实验操作与解释','Experiment controls and explanation')}">${panels[it.id]()}</section></div>
    <details class="annotation"><summary>${t('这和真实研究有什么关系？','How does this connect to research?')}</summary><p>${l(it.research)}</p>${it.layers?`<p>${l(it.layers)}</p>`:''}${it.refs.map(sourceLink).join(' ')}</details><div class="nav-row"><a href="#${index?lessons[index-1].id:'experiments'}">← ${index?l(lessons[index-1].short):t('全部实验','All experiments')}</a><a href="#${index===5?'experiments':lessons[index+1].id}">${index===5?t('回看全部实验','All experiments'):t('下一节 · ','Next · ')+l(lessons[index+1].short)} →</a></div></div></section>`;
}
function routeFromURL(){const key=location.hash.slice(1);return lessons.find(it=>it.id===(oldRoutes[key]||key))?.id || '';}
function stopPlay(){clearTimeout(clockId);clockId=null;playing=null;}
function render(navigate=false){
  const id=routeFromURL();if(id!==current){stopPlay();zoomed=false;}current=id;
  const it=lessons.find(c=>c.id===id);$('main').innerHTML=it?lessonView(it):home();
  document.title=it?l(it.title)+' · '+t('RSI 互动教程','RSI Studio'):t('RSI 互动教程 · 递归自我改进','RSI Studio · Recursive Self-Improvement');
  if(navigate){
    if(location.hash==='#experiments'){$('experiments').scrollIntoView({block:'start',behavior:'instant'});$('experiments-title').focus({preventScroll:true});}
    else{window.scrollTo({top:0,behavior:'instant'});($('chapter-title')||$('main')).focus({preventScroll:true});}
  }
}
function repaint(focus='',announce=true){
  if(current){$('art').innerHTML=drawings[current]();$('note').innerHTML=panels[current]();}
  else $('home-demo').innerHTML=homeDemo();
  const nextFocus=focus&&$('main').querySelector(focus);if(nextFocus)nextFocus.focus({preventScroll:true});
  if(announce)$('announcement').textContent=current?$('note').querySelector('.state-title').textContent:$('demo-status').textContent;
}
function schedule(){
  clockId=setTimeout(()=>{
    if(playing!=='trace'||document.hidden){stopPlay();return;}
    const state=progress.trace,next=Object.keys(tracks.trace.states[state])[0];
    progress.trace=advance('trace',state,next);if(progress.trace==='reply')stopPlay();
    const wasFocused=$('main').contains(document.activeElement)&&document.activeElement.hasAttribute('data-play');
    repaint(wasFocused?(playing?'[data-play]':'[data-track="trace"]'):'');if(playing)schedule();
  },2400);
}
$('main').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-zoom')){zoomed=!zoomed;b.setAttribute('aria-pressed',String(zoomed));b.textContent=zoomLabel();$('main').querySelector('.bench').classList.toggle('zoomed',zoomed);return;}
  if(b.dataset.play){if(playing)stopPlay();else {playing='trace';schedule();}repaint('[data-play]',false);return;}
  if(b.dataset.track){const track=b.dataset.track,state=progress[track],next=advance(track,state,b.dataset.event);if(state===next)return;stopPlay();progress[track]=next;repaint(`[data-track="${track}"]`);return;}
  if(b.dataset.select){const key=b.dataset.select,ix=Number(b.dataset.index);if(!collections[key]||!Number.isInteger(ix)||ix<0||ix>=collections[key].length)return;progress[key]=ix;repaint(`[data-select="${key}"][data-index="${ix}"]`);}
});
function themeControl(){
  const dark=document.documentElement.dataset.theme==='dark',control=$('theme-button');control.setAttribute('aria-pressed',String(dark));control.setAttribute('aria-label',t('深色模式','Dark mode'));control.title=dark?t('切换为浅色','Switch to light mode'):t('切换为深色','Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=dark?'#19151d':'#fcfafb';
}
function updateChrome(){
  document.documentElement.lang=language;const switcher=$('language-link'),other=language==='en'?'zh-CN':'en',url=new URL(location.href);url.searchParams.set('lang',other==='en'?'en':'zh');switcher.href=url.href;switcher.hreflang=other;switcher.firstElementChild.lang=other;switcher.firstElementChild.textContent=t('English','中文');switcher.setAttribute('aria-label',t('切换到英文版 · English','Switch to Chinese · 中文'));
  $('brand-name').textContent=t('RSI 互动教程','RSI Studio');$('brand-name').parentElement.setAttribute('aria-label',t('教程首页','RSI Studio home'));$('site-tools').setAttribute('aria-label',t('页面工具','Site tools'));$('foot-name').textContent=t('递归自我改进','Recursive Self-Improvement');$('footer-home').textContent=t('教程首页 ↑','Tutorial home ↑');
  $('sources-label').textContent=$('source-title').textContent=t('研究来源','Research sources');$('close-sources').textContent=t('关闭','Close');$('sources-intro').textContent=t('本教程对照原始论文和《Understanding RSI》。日历问题、执行记录和分数均为教学模拟。','This tutorial draws on original papers and Understanding RSI. The calendar questions, traces, and scores are teaching simulations.');$('source-list').innerHTML=Object.entries(refs).map(([key,entry])=>`<li>${sourceLink(key)}<br><small>${l(entry[2])}</small></li>`).join('');themeControl();
}
$('theme-button').addEventListener('click',()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('rsi-atlas-theme',root.dataset.theme);}catch{}themeControl();});
$('sources-button').addEventListener('click',()=>$('sources').showModal());$('close-sources').addEventListener('click',()=>$('sources').close());$('sources').addEventListener('click',e=>{if(e.target!==$('sources'))return;const box=e.target.getBoundingClientRect();if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)$('sources').close();});
$('language-link').addEventListener('click',e=>{
  if(e.ctrlKey||e.shiftKey||e.metaKey||e.altKey||e.button!==0)return;e.preventDefault();stopPlay();
  try{history.pushState(null,'',$('language-link').href);}catch(err){if(location.protocol!=='file:'||err.name!=='SecurityError')throw err;}
  language=language==='en'?'zh-CN':'en';updateChrome();render();$('announcement').textContent='';
});
window.addEventListener('hashchange',()=>{stopPlay();updateChrome();render(true);});
window.addEventListener('popstate',()=>{if(location.protocol==='file:')return;const wanted=new URL(location.href).searchParams.get('lang')==='en'?'en':'zh-CN';if(wanted!==language){stopPlay();language=wanted;updateChrome();render();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopPlay();repaint('',false);}});
updateChrome();render(location.hash==='#experiments');
</script>
</body>
</html>
