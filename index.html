<noscript><main class="nojs"><h1>递归自我改进 · Recursive Self-Improvement</h1><p>从一次求解到学会怎样改进，十一篇论文按机制串起一条线。启用 JavaScript 可逐步播放方法图，或从下列原论文开始阅读。</p><p>Eleven papers trace a path from solving one task to changing the strategy that improves the solver. Enable JavaScript for the worked figures, or read the original papers below.</p><ol><li><a href="https://arxiv.org/abs/2303.17651">Self-Refine</a></li><li><a href="https://arxiv.org/abs/2303.11366">Reflexion</a></li><li><a href="https://arxiv.org/abs/2509.25140">ReasoningBank</a></li><li><a href="https://arxiv.org/abs/2203.14465">STaR</a></li><li><a href="https://arxiv.org/abs/2506.10943">SEAL</a></li><li><a href="https://arxiv.org/abs/2603.28052">Meta-Harness</a></li><li><a href="https://arxiv.org/abs/cs/0309048">Gödel Machine</a></li><li><a href="https://arxiv.org/abs/2505.22954">Darwin Gödel Machine</a></li><li><a href="https://arxiv.org/abs/2310.02304">STOP</a></li><li><a href="https://arxiv.org/abs/2603.19461">Hyperagents</a></li><li><a href="https://arxiv.org/abs/2611.26806">MedicalRSI</a></li></ol></main></noscript>
<script id="survey-data">
"use strict";
const T = (zh, en) => [zh, en];
const step = (zh, en, detailZh, detailEn) => ({ title: T(zh, en), detail: T(detailZh, detailEn) });
const CHAPTERS = [
  { id:'agent', short:T('一次求解','One attempt'), title:T('先看一个 Agent 做完一次任务','Follow one agent through a task'), intro:T('从一条真实评测轨迹出发。先认清是谁做决定、谁执行动作，才看得出后来是哪一部分发生了变化。','Start with an actual benchmark trace. Locating the decision, the action and the observation makes it possible to see exactly what later methods change.') },
  { id:'memory', short:T('留下经验','Memory'), title:T('上一次的失败，下一次怎样读到？','How does a failure reach the next attempt?'), intro:T('一次回答会结束。把教训写在模型之外，它就能跨过重试边界。能否跨过任务边界，还取决于写什么、怎样取回。','An answer has an end. A written lesson can survive a retry. Reusing it on a different task also requires deciding what to store and how to find it again.') },
  { id:'weights', short:T('改变权重','Weights'), title:T('把经验写进模型','Put the experience into the model'), intro:T('另一个保存位置是模型参数。先看训练数据怎么产生，再看提出训练数据的策略能否一起学习。','Weights offer another place to keep experience. First trace how a model makes its training examples, then how it learns to make better ones.') },
  { id:'search', short:T('搜索 Harness','Harness search'), title:T('把整个 Harness 交给外层 Agent 改','Give the whole harness to an outer agent'), intro:T('如果问题出在上下文组织或工具调用，能否让一个专门读运行记录的 Agent 找到更好的实现？','If a failure begins with context selection or a tool call, could a second agent inspect the run and write a better implementation?') },
  { id:'inherit', short:T('继承代码','Inheritance'), title:T('当被改的代码也是下一代的工具','When edited code becomes the next generation’s tool'), intro:T('改解题程序，可能也会改变它将来修改自身的能力。新版本凭什么被接受？先看以证明为准的方案，再看以实验为准的方案。','Editing a task program can change its ability to edit itself later. What lets a new version take effect? Compare a proof-based rule with empirical testing.') },
  { id:'improver', short:T('改进者','The improver'), title:T('怎样看出 Improver 本身进步了？','How can we tell the improver got better?'), intro:T('三篇文章把这个问题变成了不同的实验。依次看改写搜索程序、移植元 Agent，以及固定 Solver 后更换写 Harness 的模型。','Three papers turn the question into distinct experiments. Follow a rewritten search program, a transplanted meta agent and a harness writer paired with a fixed solver.') },
  { id:'compare', short:T('对照论文','Compare'), title:T('把两篇论文放在同一张桌上','Compare two papers on the same questions'), intro:T('选两篇文章，逐项对照反馈、保留的改动和检验证据。这也是读下一篇自我改进论文时可以沿用的顺序。','Choose two papers to compare their feedback, what survives and the experiment that tests the claim. The same questions work for the next paper you read.') }
];
const STORIES = [
  { id:'base-agent', chapter:'agent', name:'Base Agent', author:'MedicalRSI', year:'2026', arxiv:'2611.26806', locator:T('图 9 · 未见工作流个案','Fig. 9 · unseen-workflow case'),
    title:T('一次运行，留下什么？','What does one run leave behind?'),
    body:T('用 MedicalRSI 的模拟病历工作流作起点。模型根据当前上下文选动作。Harness 是模型周围运行它的软件，包括提示与上下文、可用工具、工作流控制和记忆。它执行工具调用，把观察送回模型。整个循环在这里叫 Solver。','Consider a simulated records workflow from MedicalRSI. The model chooses an action from its context. Its harness supplies instructions, context, tools, workflow control and memory, executes the action and returns observations. This whole task-solving loop is the Solver.'),
    evidence:T('论文的这个未见工作流中，Solver 单独运行只通过了 11 项检查中的 2 项。运行日志记下了查到哪些记录、哪一步遗漏，以及评测器怎样判定结果。','In this unseen-workflow example the unaided Solver passes 2 of 11 checks. Its trace records what it retrieved and what it missed. The grader records which requirements the run satisfied.'),
    boundary:T('稍后回到同一条轨迹，看另一个角色怎样把失败写成 Harness，以及谁来判断这个改动有用。','We return to this very trace when a second role writes a harness and its benefit can be tested.'),
    steps:[step('接到工作流','Receive the task','一项模拟记录工作流进入 Solver，目标和可用工具成为输入。','A simulated records workflow arrives with a goal and a set of tools.'),step('模型选动作','Choose an action','模型读取上下文，选择查询记录。工具接口和上下文组织由 Harness 提供。','The model selects a record lookup from its context. The harness defines the interface and what the model sees.'),step('工具返回观察','Return an observation','Harness 执行查询，把观察追加到轨迹中。模型据此选择后续动作。','The harness executes the lookup and appends the observation to the trace for the model’s next decision.'),step('评测留下轨迹','Grade the run','图 9 的原始运行漏掉了时间窗和两项操作。2/11 是这个个案的检查通过数。','The original run misses a time window and two actions. The 2/11 count refers to this single case.')],
    handoff:T('如果只把这次的输出交回模型，最先能改的是什么？','If the model sees its own output again, what is the first thing it can change?') },
  { id:'self-refine', chapter:'agent', name:'Self-Refine', author:'Madaan et al.', year:'2023', arxiv:'2303.17651', locator:T('图 1–2 · 算法 1','Figs. 1–2 · Algorithm 1'),
    title:T('在同一道题内改答案','Revise an answer within one task'),
    body:T('以论文的代码优化任务为例，同一个语言模型先写一个解，再用另一条提示指出可改进之处。第三次调用同时看到初稿和反馈，写出新稿。循环在停止条件满足时交付当前版本。','In the paper’s code-optimization task one language model writes a solution, then critiques it under a different prompt. A third call sees both the draft and feedback and produces a revision. The loop returns the current draft when its stopping rule fires.'),
    evidence:T('作者在七类任务上把多轮版本与同一模型的一次生成比较。生成物的质量可以在这次运行内提升。','Across seven tasks the authors compare revisions with one-shot answers from the same model. That comparison tests the quality of the output produced during a run.'),
    boundary:T('下一道题仍调用原来的模型和提示。单次运行的改稿分数无法测出跨题学习。','The next independent task starts with the same model and prompts. A revision score measures improvement within the current task.'),
    fields:[T('对当前草稿的文字反馈','A critique of the current draft'),T('当前题的修订稿','The current task’s revised draft'),T('同一模型分三种提示调用','One model under three prompts'),T('同题初稿与修订稿','Initial vs revised answer on one task')],
    steps:[step('初稿','Draft','第一次调用得到当前版本，论文示例中是待优化的代码。','The first call produces the candidate, a piece of code in the optimization example.'),step('批注','Critique','反馈调用指出具体问题，初稿和批注同时留在这一轮的上下文里。','The feedback call identifies a concrete weakness. Both the critique and draft remain available.'),step('修订','Revise','修订调用读两份材料，返回一份替换草稿。','The refiner reads both artifacts and returns a replacement draft.'),step('停止或再改','Stop or repeat','停止条件决定交付当前稿或继续批注。下一独立任务会新建上下文。','The stopping rule returns this draft or requests another critique. An independent task starts a fresh context.')],
    handoff:T('留下批注，让下一次重试读到它。Reflexion 把这个动作写进了 Agent。','Keep a critique for the next trial. Reflexion builds that handoff into an agent.') },
  { id:'reflexion', chapter:'memory', name:'Reflexion', author:'Shinn et al.', year:'2023', arxiv:'2303.11366', locator:T('图 2–3 · ALFWorld','Figs. 2–3 · ALFWorld'),
    title:T('把失败留给下一次重试','Leave a failed trial a note for the retry'),
    body:T('在 ALFWorld 文本环境里，Actor 连续执行动作。Evaluator 判断这轮是否完成。失败时，反思模块把结果和轨迹写成一段短记忆。重置环境后，Actor 带着这段记忆再试同一项任务。','In the ALFWorld text environment an actor takes a sequence of actions. An evaluator assesses the attempt. After a failure, a reflection module turns the outcome and trajectory into a short memory. The environment resets and the actor reads the note on its retry.'),
    evidence:T('图 3 在 134 个 ALFWorld 任务上跟踪随重试累计解决的比例。横轴上的每一步都允许再尝试一次。','Figure 3 tracks the cumulative share solved across 134 ALFWorld tasks as retries are allowed. Each tick grants another attempt.'),
    boundary:T('这一实验测试同一任务上的记忆和重试。要检验跨任务经验，还得把记忆交给另一道题。','This experiment tests memory across retries of a task. Cross-task reuse requires delivering a lesson to a different task.'),
    fields:[T('环境结果与动作轨迹','Environment outcome and trajectory'),T('供重试读取的反思记忆','An episodic note for a retry'),T('Actor、评估与反思模块','Actor, evaluator and reflection module'),T('ALFWorld 的累计重试成功率','Cumulative ALFWorld success across retries')],
    steps:[step('尝试','Act','Actor 在环境中行动，轨迹逐步增长。','The actor works in the environment and accumulates a trace.'),step('识别失败','Evaluate','环境完成信号或评估器给这一轮一个结果。','An environment signal or evaluator assesses this attempt.'),step('写反思','Write a reflection','把失败轨迹和反馈压缩为一段面向下一次行动的建议。','The reflector turns the trace and feedback into advice for a future action.'),step('带记忆重试','Retry with memory','环境回到起点，短记忆进入 Actor 的上下文。','The environment resets and the note enters the actor’s context.')],
    handoff:T('换一道题时，怎样找到值得复用的教训？','Once the task changes, which lesson should the agent retrieve?') },
  { id:'reasoningbank', chapter:'memory', name:'ReasoningBank', author:'Ouyang et al.', year:'2025', arxiv:'2509.25140', locator:T('图 2 · 表 1','Fig. 2 · Table 1'),
    title:T('从成功和失败中提取可检索的策略','Retrieve strategies from successes and failures'),
    body:T('新任务先按语义相似度从记忆库取回策略。任务结束后，模型判断轨迹是否成功，从成功路径提炼可复用的做法，从失败路径提炼应躲开的错误。新条目回到同一个库，供后续任务检索。','A new task first retrieves strategies by semantic similarity. After the run a model judges the trajectory, distills reusable practices from successes and pitfalls from failures, and stores new items in the same bank for later tasks.'),
    evidence:T('WebArena 上，Gemini 2.5 Flash 无记忆时成功率为 40.5%，使用 ReasoningBank 时为 48.8%。表 1 中两者的平均交互步数分别为 9.7 和 8.3。','On WebArena, Gemini 2.5 Flash succeeds on 40.5% of tasks without memory and 48.8% with ReasoningBank. Mean interaction steps are 9.7 and 8.3 respectively in Table 1.'),
    boundary:T('写入变多和检索变好可以提高任务表现。论文另用不同采样预算研究 MaTTS，比较时要看清采样设置。','A growing, more useful memory can raise task performance. The separate MaTTS experiments also vary sampling, so their compute setting matters.'),
    fields:[T('自评成功与失败的轨迹','Self-judged successes and failures'),T('跨任务检索的策略条目','Retrievable cross-task strategies'),T('提取与检索记忆的流程','Memory extraction and retrieval'),T('同一骨干模型，有无记忆','Same backbone, with and without memory')],
    steps:[step('按题检索','Retrieve','用当前任务查询历史记忆，只把相关条目送进上下文。','Use the current query to retrieve relevant items and place them in context.'),step('完成任务','Run','Agent 依据检索到的策略行动，并保留成功或失败的轨迹。','The agent acts with the retrieved strategies and retains the resulting trace.'),step('提炼条目','Distill','判断轨迹结果，把可迁移的策略或失败教训写成记忆条目。','Judge the outcome and distill a reusable strategy or failure lesson.'),step('下题取回','Reuse','把条目并入库中，下一项相关任务可以取回。','Consolidate the item. A later related task can retrieve it.')],
    aside:{name:'ACE',year:'2025',arxiv:'2510.04618',text:T('另一个写法是把上下文当作工作手册。ACE 的 Generator 标记条目是否有用，Reflector 提炼经验，Curator 产生局部增量，由程序合并进手册。这里保留的是带编号的条目和修改。','An alternative edits a playbook. ACE’s Generator marks useful entries, the Reflector extracts lessons and the Curator emits localized changes. A deterministic merge updates the numbered entries.')},
    handoff:T('如果关掉文字记忆，模型还能把经验带到下道题吗？','Could the lesson survive without a text memory at all?') },
  { id:'star', chapter:'weights', name:'STaR', author:'Zelikman et al.', year:'2022', arxiv:'2203.14465', locator:T('图 2 · 表 1','Fig. 2 · Table 1'),
    title:T('把经过筛选的理由变成训练数据','Turn selected rationales into training data'),
    body:T('模型先为带答案的训练题生成理由和预测。预测正确的理由进入训练集。答错时，把正确答案临时作为提示，请模型重新解释。通过检查的理由移除提示后用于微调，再用更新后的模型生成下一批。','The model produces a rationale and a prediction for labeled training questions. Correct predictions yield training examples. After a miss, the model gets the correct answer as a temporary hint and tries to explain it. Accepted rationales become finetuning targets without the hint. The updated model generates the next batch.'),
    evidence:T('CommonsenseQA 开发集上，GPT-J 直接按答案微调得到 60.0%，STaR 不做提示重生成得到 68.8%，加入这一步后得到 72.5%。','On the CommonsenseQA dev set GPT-J scores 60.0% with direct answer finetuning, 68.8% with STaR without rationalization, and 72.5% with rationalization.'),
    boundary:T('理由通过的是答案检查。正确答案本身不足以保证理由的每一步都成立。筛选规则由研究者设定。','Selection checks the final answer. An accepted rationale can still contain faulty reasoning. The selection procedure is specified by the researchers.'),
    fields:[T('已知训练答案与模型预测','Known training answers and predictions'),T('用自生成理由微调的权重','Weights fit to self-generated rationales'),T('固定的生成、筛选与微调程序','A prescribed generate–filter–finetune loop'),T('有无提示重生成的消融','Rationalization ablation')],
    steps:[step('先预测','Predict','在没有答案提示的情况下生成理由和预测。','Generate a rationale and prediction without revealing the answer.'),step('筛选或补提示','Filter or give a hint','正确的进入候选集。失败的训练例得到正确答案提示，再生成理由。','Keep correct predictions. A failed training question gets a correct-answer hint for another rationale.'),step('移除提示训练','Train without hints','训练输入只保留题目，合格理由和答案成为目标。','Use the question alone as input and the accepted rationale and answer as the training target.'),step('下一轮生成','Generate again','更新后的权重处理下一批问题，再执行同一筛选过程。','The updated weights generate a new batch under the same selection procedure.')],
    handoff:T('STaR 给定了筛选办法。能否用更新后的表现来教模型怎样写更新？','Could the updated model’s performance teach it how to write a better update?') },
  { id:'seal', chapter:'weights', name:'SEAL', author:'Zweiger et al.', year:'2025', arxiv:'2506.10943', locator:T('图 1、6 · 表 2','Figs. 1, 6 · Table 2'),
    title:T('用更新后的成绩奖励写更新的模型','Reward the model for the edit it writes'),
    body:T('以吸收一段新知识为例。模型把段落改写成自编辑训练材料。内层用这些材料微调一份模型，再撤走原段落做问答。外层拿这份模型的成绩奖励产生材料的策略。这里需要分清哪一次训练在吸收知识，哪一次在学习怎样吸收。','For knowledge incorporation, the model turns a passage into self-edit training material. An inner update fits a model on that material, then tests it on questions with the passage removed. An outer training loop rewards the policy that wrote the edit using downstream performance.'),
    evidence:T('Qwen2.5-7B 在单段落 LoRA 设置下，只用原段落微调得 33.5%，用基础模型额外生成材料得 39.7%，经过 SEAL 训练的自编辑得 47.0%。','For Qwen2.5-7B with single-passage LoRA, no-context QA accuracy is 33.5% with the passage alone, 39.7% with base-model synthetic material, and 47.0% with SEAL self-edits.'),
    boundary:T('外层学到了产生自编辑的策略，微调程序仍有预先设定的部分。图 6 还显示，连续写入新段落会损伤早先知识。','The outer loop learns an edit policy within a prescribed training procedure. Figure 6 also finds that sequential edits degrade retention of earlier passages.'),
    fields:[T('自编辑后模型的下游问答成绩','Downstream QA after applying an edit'),T('内层适配权重与外层自编辑策略','Adapted weights and a learned edit policy'),T('同一模型写材料，外层奖励训练策略','A model writes edits and outer rewards train that policy'),T('未训练与已训练的自编辑、遗忘测试','Untrained vs learned edits and retention tests')],
    steps:[step('读段落','Read a passage','用一段待吸收的新文本作为自编辑的条件。','Condition the self-edit on a passage to be incorporated.'),step('写材料','Write a self-edit','模型写出从段落推导的陈述，作为小规模微调材料。','The model generates implications of the passage as finetuning material.'),step('做内层更新','Apply the inner edit','微调模型后撤走原文，用相关问题检验写入效果。','Fit the model, remove the passage and evaluate the edit with related questions.'),step('训练编辑策略','Train the edit policy','将下游效果送回外层，改变以后产生自编辑的策略。','Feed downstream performance to the outer loop to update how future edits are generated.')],
    handoff:T('SEAL 改模型参数。把改动对象换成 Solver 周围的代码，会出现另一种搜索。','Change the target from weights to the software around the Solver and the search takes another form.') },
  { id:'meta-harness', chapter:'search', name:'Meta-Harness', author:'Lee et al.', year:'2026', arxiv:'2603.28052', locator:T('图 2 · 表 6','Fig. 2 · Table 6'),
    title:T('让提案者翻查每个旧版本的运行记录','Let the proposer open the history of every candidate'),
    body:T('论文把每个候选 Harness 的源码、执行轨迹和分数存入文件系统。外层编码 Agent 可以选择读哪次失败、对照哪段实现，然后提交新代码。评测程序运行新 Harness，把结果也存回历史。','Each candidate harness leaves source code, execution traces and scores in a filesystem. An outer coding agent chooses which failures and implementations to inspect, then proposes new code. Evaluation runs that harness and adds its records to the history.'),
    evidence:T('在 200 道 IMO 级数学题上，搜索到的同一个检索 Harness 交给五个留出的模型，相对无检索平均提高 4.7 个百分点。改动对其他 Solver 也有用。','On 200 IMO-level math problems, one discovered retrieval harness improves accuracy by 4.7 percentage points on average across five held-out models versus no retrieval. The artifact transfers to other solvers.'),
    boundary:T('外层 Agent 的可读历史持续增长。表 6 比较的是部署后的 Harness；判断提案者自己是否学得更会改，需要单独比较提案者。','The proposer’s accessible history grows. Table 6 measures the deployed harness. Isolating improvement in the proposer itself would require comparing proposers.'),
    fields:[T('全部候选的源码、分数与轨迹','Prior candidate code, scores and traces'),T('搜索到的 Harness 代码与历史','Discovered harness code and search history'),T('外层编码 Agent','An outer coding agent'),T('一个 Harness 迁移到留出的 Solver','One harness transfers to held-out solvers')],
    steps:[step('打开历史','Open history','每个候选各有一份代码、分数和执行轨迹，提案者按需打开。','Each candidate has its own code, score and traces. The proposer opens selected records.'),step('定位问题','Inspect a failure','沿失败轨迹回到生成这段上下文的 Harness 代码。','Trace a failed run back to the harness code that assembled its context.'),step('提交新代码','Propose code','外层 Agent 提交一个可执行候选，例如修改数学检索策略。','The outer agent proposes executable code, such as a revised math retrieval strategy.'),step('评测并归档','Evaluate and file','在评测任务上运行，源码、轨迹和成绩一起进入历史。','Run the evaluation and file the candidate, traces and scores together.')],
    aside:{name:'AlphaEvolve',year:'2025',arxiv:'2506.13131',text:T('同样由评测筛选代码，产物也可能是任务算法。AlphaEvolve 找到用 48 次标量乘法完成两个 4 × 4 复矩阵相乘的算法。这个结果评测的是矩阵算法；要把它归为改进者进化，还需追踪搜索程序本身发生了什么。','Evaluation can also select a task algorithm. AlphaEvolve found a procedure multiplying two 4 × 4 complex matrices in 48 scalar multiplications. This result evaluates the matrix algorithm. A claim about the searcher would require tracing changes to the search procedure.')},
    handoff:T('被找到的新代码，什么时候也有权改写下一代？','When can the code you discover also rewrite the next generation?') },
  { id:'godel-machine', chapter:'inherit', name:'Gödel Machine', author:'Schmidhuber', year:'2003', arxiv:'cs/0309048', locator:T('第 2–4 节 · 切换条件','§§2–4 · switch condition'),
    title:T('把改写自身的搜索器也放进程序','Put the rewrite searcher inside its own program'),
    body:T('这个理论起点包含任务程序、效用目标和一个证明搜索器。搜索器寻找关于候选改写的证明，包括立刻切换比继续搜索更有益的条件。一旦证明成立，程序执行改写，搜索器本身也在可改写范围内。','This theoretical design includes a task program, a utility objective and a proof searcher. It seeks a proof that switching to a candidate rewrite now has higher expected utility than continuing the search. A proved switch can rewrite the searcher itself.'),
    evidence:T('论文在给定公理、效用与可证明性的前提下分析切换规则。检验一个改写的依据是证明义务。','The paper analyzes the switching rule under its axioms, utility and provability assumptions. The warrant for a particular rewrite is a proof obligation.'),
    boundary:T('有益改动能否及时找到证明，是这个设计的实际瓶颈。该理论没有给出现代语言模型的任务分数。','Finding a suitable proof in time is a practical bottleneck. The theoretical result has a different evidentiary status from a measured language-model benchmark.'),
    fields:[T('公理下的预期效用证明','A proof about expected utility under axioms'),T('已证明有益的程序改写','A proved self-rewrite'),T('程序内的证明搜索器','An internal proof searcher'),T('理论切换条件','A theoretical switching condition')],
    steps:[step('定义效用','Specify utility','初始程序描述状态、效用目标和可用公理，证明搜索器属于系统。','The initial program includes the state, utility, axioms and proof searcher.'),step('搜索证明','Search for a proof','候选改写可以涉及任务代码，也可以涉及搜索器。','The candidate can target task code or the searcher.'),step('检验切换条件','Check the switch','需要比较立即执行改写与继续原搜索的预期效用。','The proof must compare switching now with continuing the existing search.'),step('执行改写','Apply a proved rewrite','证明成立才切换。时间和可证明性都会限制哪种更新实际发生。','Switch only when a proof is found. Time and provability constrain which updates occur.')],
    handoff:T('如果把证明义务换成可重复的编码评测，候选能怎样留下？','Replace the proof obligation with repeatable coding evaluation. How should candidate agents survive?') },
  { id:'dgm', chapter:'inherit', name:'Darwin Gödel Machine', author:'Zhang et al.', year:'2025', arxiv:'2505.22954', locator:T('图 2–3 · 附录 G','Figs. 2–3 · Appendix G'),
    title:T('把子代放进一棵可再次取样的树','Archive descendants in a tree you can sample again'),
    body:T('从档案里选一个编码 Agent，让它修改自身代码，得到子代。子代在编码任务上接受测试。可继续探索的版本被加入档案，父代仍可再次被选中。论文发现的新工具与上下文管理也会随代码传给后代。','Sample a coding agent from the archive and let it edit its own code to produce a child. Evaluate the child on coding tasks and archive viable variants. A previous parent remains selectable. Discovered tools and context-management routines are inherited through the agent code.'),
    evidence:T('在完整 Polyglot 基准上，基础 Agent 的 pass@1 为 14.2%，最佳发现版本为 30.7%。这组数是完整基准复评，与搜索时的小样本评测分开。','On the full Polyglot benchmark the base agent reaches 14.2% pass@1 and the best discovered agent 30.7%. These are full-benchmark reevaluations, separate from the smaller evaluations used during search.'),
    boundary:T('同一编码能力同时服务于解决编程题和修改 Agent。只看子代的解题分数，难以拆出这两种能力各自的贡献。图中截取论文档案的实际节点；节点 6 与 24 提供了两种细粒度文件编辑实现。','Coding skill serves both task solving and agent modification. A descendant’s task score alone does not isolate these contributions. The figure traces actual archive nodes. Nodes 6 and 24 offer two implementations of fine-grained file edits.'),
    fields:[T('候选编码 Agent 的基准结果','Benchmarks of candidate coding agents'),T('保留父子关系的 Agent 代码档案','An archive of agent code and parentage'),T('选中的编码 Agent 修改自身代码','A sampled coding agent edits its code'),T('子代基准、冻结编辑者与档案消融','Descendant scores and editor/archive ablations')],

<script id="survey-reader">

let timer=null,queuedScroll=false,anchorReady=false,suspendedScroll=false;
function navHTML(){return `<header class="mast"><div class="mast-inner"><a class="brand" href="#cover" aria-label="${esc(l(T('回到综述开头','Back to survey cover')))}">${logo}<span>RSI Atlas</span></a><div class="mast-tools"><a class="compare-link" href="#compare">${ico('book')}${l(T('论文对照','Compare papers'))}</a><div class="lang-switch" aria-label="${l(T('语言','Language'))}"><button type="button" data-lang="zh" lang="zh-CN" aria-pressed="${language==='zh'}">中文</button><button type="button" data-lang="en" lang="en" aria-pressed="${language==='en'}">EN</button></div><button class="icon-btn" id="theme" type="button"></button></div></div></header>`;}

function heroContent(){return `<div class="overview-art">${heroView(state.hero,false)}</div><div class="cover-control"><div class="mini-select" aria-label="${l(T('选择反馈路径','Choose a feedback path'))}">${HERO_TITLES.map((v,i)=>`<button type="button" data-hero="${i}" aria-pressed="${state.hero===i}">${l(v)}</button>`).join('')}</div><p>${l(HERO_CAPTIONS[state.hero])}</p></div>`;}
function cover(){return `<section class="cover" id="cover" aria-labelledby="cover-title"><div class="cover-text"><div class="folio"><span class="folio-rule"></span>${l(T('交互式论文综述','An interactive research survey'))}</div><h1 id="cover-title">${l(T('递归自我改进','Recursive<br>self-improvement'))}</h1><p class="cover-lede">${l(T('一次失败，怎样改变下一次解题？又怎样改变下一次改进？沿着同一条线，看十一篇论文怎样回答这两个问题。','How does a failed attempt change the next solution? How does it change the next improvement? Follow eleven papers from a base agent to an evolving improver.'))}</p><div class="cover-actions"><a class="primary" href="#base-agent">${l(T('从 Base Agent 开始','Start with the base agent'))} ${ico('arrow')}</a><button type="button" class="text-btn" data-tour>${ico('play')}${l(T('连续播放','Play the walkthrough'))}</button></div><div class="cover-meta"><span>2003—2026</span><i></i><span>${l(T('11 篇主读 · 2 篇旁注','11 studies · 2 companion papers'))}</span></div></div><figure class="cover-plate"><div class="plate-meta"><span>FIG. 00</span><span>${l(T('求解与改进的两条反馈路径','Two feedback paths'))}</span></div><div id="overview">${heroContent()}</div></figure></section>`;}
function navigation(){return `<nav class="chapter-nav" aria-label="${l(T('综述章节','Survey chapters'))}"><div class="nav-list">${CHAPTERS.map((c,i)=>`<a href="#${c.id}" data-chap="${c.id}"><span aria-hidden="true">${i+1}</span>${l(c.short)}</a>`).join('')}</div><div class="read-progress" aria-hidden="true"><i id="read-fill"></i></div></nav>`;}
function chapterHead(c,i){return `<div id="${c.id}" class="chapter-head"><div class="folio"><span class="folio-rule"></span>${l(T('第 '+(i+1)+' 节','Chapter '+(i+1)))}</div><h2>${l(c.title)}</h2><p>${l(c.intro)}</p></div>`;}
function optionName(o){return `${o.backbone} · ${l(o.role==='base'?T('Base Agent','Base agent'):T('GRPO Solver','GRPO solver'))}`;}
function medicalBars(){const o=MEDICAL_CONTROLS[state.solver];const labels=[T('Solver 单独运行','Solver alone'),T('GRPO Improver 的 Harness','GRPO Improver harness'),T('MedicalRSI 的 Harness','MedicalRSI harness')];return `<div class="clinical-bars" role="img" aria-label="${esc(optionName(o)+' · '+o.scores.join('%, ' )+'%')}">${o.scores.map((v,i)=>`<div class="result-bar"><span>${l(labels[i])}</span><div class="bar-track"><i style="--score:${v}%" class="bar-${i}"></i></div><b>${v}%</b></div>`).join('')}</div><p class="delta"><b>+${o.gain.toFixed(1)} ${l(T('个百分点','pp'))}</b> ${l(T('同一 Solver 更换 Harness 写作者的差值。柱上为原图取整标签，差值取自原图标注。','for changing the harness writer with this Solver fixed. Bars use the source’s rounded labels. The difference uses its reported annotation.'))}</p>`;}
function medicalLab(){return `<section class="medical-lab" aria-labelledby="control-title"><div class="folio">FIG. 5a · MEDAGENTBENCH</div><h4 id="control-title">${l(T('换 Improver，保持 Solver 相同','Swap the Improver, keep the Solver fixed'))}</h4><label>${l(T('选择固定的 Solver','Fixed Solver'))}<select id="fixed-solver">${MEDICAL_CONTROLS.map((o,i)=>`<option value="${i}" ${i===state.solver?'selected':''}>${optionName(o)}</option>`).join('')}</select></label><div id="medical-bars" aria-live="polite">${medicalBars()}</div></section>`;}
function paperArticle(s,i){const companion=s.aside?`<aside class="companion"><span class="companion-label">${l(T('对照阅读','In parallel'))}</span><h4>${s.aside.name} <small>${s.aside.year}</small></h4><p>${l(s.aside.text)}</p>${source(s.aside)}</aside>`:'';return `<article class="study" id="${s.id}" data-story="${i}" aria-labelledby="heading-${s.id}"><div class="paper-meta"><span>${i===0?l(T('起点','Starting point')):l(T('论文','Paper'))+' '+num(i)}</span><i></i>${esc(s.author)} · ${s.year}</div><h3 id="heading-${s.id}">${esc(s.name)}</h3><p class="question">${l(s.title)}</p><p class="body-copy">${l(s.body)}</p><div class="inline-dock" data-inline="${i}"></div><div class="evidence"><h4>${l(i===0?T('个案记录','Case record'):T('论文怎样检验','What the paper tests'))}</h4><p>${l(s.evidence)}</p></div>${s.id==='medicalrsi'?medicalLab():''}<p class="boundary">${l(s.boundary)}</p><div class="source-line">${source(s)}<span>${l(s.locator)}</span></div>${companion}<p class="handoff">${ico('arrow')}<span>${l(s.handoff)}</span></p></article>`;}
function compareTable(){const choices=state.pair.map(id=>papers.find(p=>p.id===id));return `<div class="matrix" role="table" aria-label="${l(T('研究方法对照','Method comparison'))}"><div class="matrix-row matrix-head" role="row"><div role="columnheader">${l(T('问题','Question'))}</div>${choices.map((s,i)=>`<div role="columnheader"><label>${l(i===0?T('论文 A','Paper A'):T('论文 B','Paper B'))}<select data-compare="${i}">${papers.map(p=>`<option value="${p.id}" ${p.id===s.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><a href="#${s.id}">${l(T('回看方法','Go to method'))} ${ico('arrow')}</a></div>`).join('')}</div>${FIELDS.map((f,i)=>`<div class="matrix-row" role="row"><div class="matrix-label" role="rowheader">${l(f)}</div>${choices.map(s=>`<div role="cell">${l(s.fields[i])}</div>`).join('')}</div>`).join('')}</div>`;}
function synthesis(){const c=CHAPTERS.at(-1);return `<section class="synthesis">${chapterHead(c,CHAPTERS.length-1)}<div class="end-definition"><strong>${l(T('这一综述采用的工作定义','The working definition in this survey'))}</strong><p>${l(T('SI 用经验改进系统以后的表现。若系统的反馈又更新了产生、评估或保留未来改动的策略，便形成这里讨论的递归。Solver 与 Improver 是两个角色，可以共用权重，可以分别运行，也可以由一个程序承担。称某种机制可递归，与证明改进者在同等条件下更有效，是两个需要分别检验的问题。','SI uses experience to improve later system behavior. Recursion enters when the system’s feedback also updates the strategy that generates, evaluates or retains future changes. Solver and Improver are roles that can share weights, run separately or live in a single program. Whether a mechanism admits recursion and whether its improver works better under matched conditions are distinct empirical questions.'))}</p></div><div id="matrix-wrap">${compareTable()}</div><p class="scope">${l(T('选文按改动的位置和可检验的证据排列，年份标记首次公开的版本。实验数字来自各论文，比较时保留各自的数据集、基线与单位。','Papers follow the location of the edit and the evidence used to test it. Years mark first public versions. Reported results retain each paper’s own benchmark, baseline and units.'))}</p><a href="#cover" class="back-top">${l(T('回到开头','Back to the beginning'))} ↑</a></section>`;}
function currentChoice(s){return state.choices[s.id];}

  return s.steps[z].detail;
}
function playerHTML(i,context,fresh=false){const s=STORIES[i],z=state.steps[i],v=VARIANTS[s.id],choice=currentChoice(s),playing=state.playing&&state.story===i;

}
function readerHTML(){const chapters=CHAPTERS.slice(0,-1);return `<div class="read-layout" id="reader"><div class="narrative">${chapters.map((c,j)=>`<section class="chapter" data-chapter="${c.id}">${chapterHead(c,j)}${STORIES.map((s,i)=>s.chapter===c.id?paperArticle(s,i):'').join('')}</section>`).join('')}</div><div class="sticky-column"><div class="desktop-dock" id="stage-dock"></div></div></div>`;}
function redraw(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=l(T('递归自我改进 · 交互式论文综述','Recursive Self-Improvement · An Interactive Research Survey'));byId('app').innerHTML=`${navHTML()}<main>${cover()}${navigation()}${readerHTML()}${synthesis()}</main><footer><div class="footer-rule"></div><span>RSI Atlas</span><a href="https://github.com/REAL-Lab-NU/rsi-interactive-tutorial" rel="noopener noreferrer" target="_blank">GitHub ${ico('out')}</a></footer>`;themeButton();setupFigures();setCurrentChapter(STORIES[state.story].chapter);}
function setupFigures(){if(mob.matches){byId('stage-dock').replaceChildren();document.querySelectorAll('[data-inline]').forEach(el=>{el.innerHTML=playerHTML(+el.dataset.inline,'inline')});}else {document.querySelectorAll('[data-inline]').forEach(el=>el.replaceChildren());byId('stage-dock').innerHTML=playerHTML(state.story,'desk');}}
function repaint(i=state.story,fresh=false){const dock=mob.matches?document.querySelector(`[data-inline="${i}"]`):byId('stage-dock');if(!dock||(!mob.matches&&i!==state.story))return;
  const a=document.activeElement,attrs=['data-step','data-action','data-variant'];let focus=null;if(dock.contains(a))for(const k of attrs)if(a.hasAttribute(k))focus=`[${k}="${a.getAttribute(k)}"]`;

function setCurrentChapter(id){document.querySelectorAll('[data-chap]').forEach(a=>{if(a.dataset.chap===id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')});const wrap=document.querySelector('.nav-list'),active=wrap?.querySelector('[aria-current]');if(mob.matches&&active){const delta=active.getBoundingClientRect().left-wrap.getBoundingClientRect().left;if(delta<8||delta+active.offsetWidth>wrap.clientWidth-8)wrap.scrollLeft+=delta-(wrap.clientWidth-active.offsetWidth)/2;}}
function scrollSync(){queuedScroll=false;if(!anchorReady||suspendedScroll)return;const nav=document.querySelector('.chapter-nav'),probe=Math.min(innerHeight*.34,218);const atCompare=byId('compare').getBoundingClientRect().top<=probe,atCover=byId('agent').getBoundingClientRect().top>probe;const last=document.documentElement.scrollHeight-innerHeight;byId('read-fill').style.width=`${Math.max(0,Math.min(100,100*scrollY/Math.max(1,last)))}%`;let i=0;
  if(!atCover){for(let n=0;n<STORIES.length;n++){const s=STORIES[n];const first=n===0||STORIES[n-1].chapter!==s.chapter;const top=byId(first?s.chapter:s.id).getBoundingClientRect().top;if(top<=probe)i=n;else break;}}
  if(!atCompare&&i!==state.story){const old=state.story;state.story=i;if(state.playing)halt(false);if(mob.matches)repaint(old);repaint(i,true);}
  nav.classList.toggle('on-cover',atCover);setCurrentChapter(atCover?'':atCompare?'compare':STORIES[i].chapter);}
function scheduleScroll(){if(!queuedScroll){queuedScroll=true;requestAnimationFrame(scrollSync)}}
function anchor(id){return byId(Object.hasOwn(ALIASES,id)?ALIASES[id]:id);}
function land(id,historyMode='push'){const el=anchor(id);if(!el)return false;const hash='#'+encodeURIComponent(ALIASES[id]||id);if(location.hash!==hash&&historyMode){if(historyMode==='replace')history.replaceState(null,'',hash);else history.pushState(null,'',hash);}el.scrollIntoView({block:'start',behavior:'instant'});scheduleScroll();return true;}
function showStop(i,reset=false,animated=false,historyMode='push'){
  if(i>=STORIES.length){halt();land('compare',historyMode);return;}
  const old=state.story;state.story=i;if(reset)state.steps[i]=0;
  if(mob.matches&&old!==i)repaint(old);repaint(i,animated);
  land(STORIES[i].id,historyMode);
  if(mob.matches&&state.playing)document.querySelector(`[data-inline="${i}"]`).scrollIntoView({block:'start',behavior:'instant'});
}
function halt(paint=true){clearTimeout(timer);timer=null;if(!state.playing)return;state.playing=false;if(paint)repaint();}
function advance(autoplay=false){const i=state.story;if(state.steps[i]<STORIES[i].steps.length-1){state.steps[i]++;repaint(i,true);}else showStop(i+1,true,true,autoplay?'replace':'push');}
function arm(){clearTimeout(timer);if(state.playing)timer=setTimeout(()=>{advance(true);arm()},5200);}
function play(i,fromCover=false){if(state.playing&&!fromCover){halt();return;}halt(false);state.playing=true;showStop(i,fromCover,true);arm();}
function setLanguage(value,focus=true){
  if(value===language)return;
  const fraction=scrollY;
  const here=document.elementFromPoint(Math.min(innerWidth*.27,290),Math.min(innerHeight*.35,210));
  const article=here?.closest('article,.chapter-head,.synthesis,.cover')||byId(STORIES[state.story].id);
  const y=article.getBoundingClientRect().top,id=article.id||'compare';
  halt(false);suspendedScroll=true;language=value;save('rsi-atlas-lang',value);
  const u=new URL(location.href);u.searchParams.set('lang',value);history.replaceState(null,'',u);redraw();
  if(fraction===0)scrollTo(0,0);else{const restored=byId(id);if(restored)scrollBy(0,restored.getBoundingClientRect().top-y);}
  suspendedScroll=false;scheduleScroll();
  if(focus)document.querySelector(`[data-lang="${value}"]`)?.focus({preventScroll:true});
}
document.addEventListener('click',event=>{
  const el=event.target.closest('button,a,[data-setframe]');if(!el)return;const player=el.closest('[data-player]');const i=player?Number(player.dataset.index):state.story;
  if(el.matches('a[href^="#"]')){if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;const id=el.hash.slice(1);if(anchor(id)){event.preventDefault();halt();land(id);}return;}
  if(el.hasAttribute('data-lang')){setLanguage(el.dataset.lang);return;}
  if(el.id==='theme'){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('rsi-atlas-theme',next);themeButton();return;}
  if(el.hasAttribute('data-hero')){state.hero=+el.dataset.hero;byId('overview').innerHTML=heroContent();byId('overview').querySelector('.overview-art').innerHTML=heroView(state.hero,!reduced.matches);byId('overview').querySelector(`[data-hero="${state.hero}"]`).focus({preventScroll:true});return;}
  if(el.hasAttribute('data-tour')){play(0,true);return;}
  if(!player||el.disabled)return;
  if(el.dataset.action==='inspect'){openZoom(i);return;}
  if(el.dataset.action==='play'){play(i);return;}
  if(el.hasAttribute('data-step')||el.hasAttribute('data-setframe')){halt(false);state.story=i;state.steps[i]=Number(el.dataset.step??el.dataset.setframe);repaint(i,true);return;}
  if(el.hasAttribute('data-variant')){halt(false);state.story=i;state.choices[STORIES[i].id]=el.dataset.variant;state.steps[i]=VARIANTS[STORIES[i].id].frame;repaint(i,true);return;}
  halt(false);state.story=i;if(el.dataset.action==='prev-paper')showStop(i-1,true,true);if(el.dataset.action==='next-paper')showStop(i+1,true,true);if(el.dataset.action==='next-step')advance();
});
document.addEventListener('change',e=>{if(e.target.id==='fixed-solver'){halt();state.solver=+e.target.value;byId('medical-bars').innerHTML=medicalBars();}if(e.target.hasAttribute('data-compare')){halt();const col=+e.target.dataset.compare;const other=1-col;if(e.target.value===state.pair[other])state.pair[other]=state.pair[col];state.pair[col]=e.target.value;byId('matrix-wrap').innerHTML=compareTable();document.querySelector(`[data-compare="${col}"]`).focus({preventScroll:true});}});
window.addEventListener('scroll',scheduleScroll,{passive:true});window.addEventListener('resize',scheduleScroll,{passive:true});mob.addEventListener('change',()=>{setupFigures();scheduleScroll()});
for(const ev of ['wheel','touchstart'])window.addEventListener(ev,()=>halt(),{passive:true});
document.addEventListener('keydown',e=>{if(['PageUp','PageDown','Home','End','ArrowDown','ArrowUp','Escape'].includes(e.key))halt();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)halt();});
window.addEventListener('hashchange',()=>{halt();const urlLang=new URL(location.href).searchParams.get('lang');if(urlLang==='en'||urlLang==='zh')setLanguage(urlLang,false);if(location.hash)land(location.hash.slice(1),false);else scrollTo(0,0);});
const zoom=byId('enlarged-figure');let zoomOrigin=null;
function openZoom(i){
  halt(false);state.story=i;repaint(i);zoomOrigin=i;const s=STORIES[i];
  zoom.innerHTML=`<div class="zoom-shell"><div class="zoom-head"><h2>${esc(s.name)}</h2><form method="dialog"><button>${l(T('关闭','Close'))} ×</button></form></div><div class="zoom-scroll">${scene(s,state.steps[i],currentChoice(s),!reduced.matches,'zoom')}</div><div class="zoom-steps">${s.steps.map((k,j)=>`<button type="button" data-zoom-step="${j}" aria-pressed="${j===state.steps[i]}">${j+1} · ${l(k.title)}</button>`).join('')}</div><p class="zoom-detail">${l(dynamicDetail(s,state.steps[i]))}</p></div>`;
  if(!zoom.open)zoom.showModal();
  zoom.querySelector(`[data-zoom-step="${state.steps[i]}"]`).focus({preventScroll:true});
}
zoom.addEventListener('click',e=>{if(e.target===zoom){zoom.close();return;}const el=e.target.closest('[data-zoom-step],[data-setframe]');if(el&&zoomOrigin!==null){state.steps[zoomOrigin]=Number(el.dataset.zoomStep??el.dataset.setframe);openZoom(zoomOrigin);}});
zoom.addEventListener('close',()=>{if(zoomOrigin!==null){const dock=mob.matches?document.querySelector(`[data-inline="${zoomOrigin}"]`):byId('stage-dock');dock?.querySelector('[data-action="inspect"]')?.focus({preventScroll:true});}zoomOrigin=null;zoom.replaceChildren();});
redraw();anchorReady=true;const firstHash=location.hash.slice(1);if(firstHash)land(firstHash,'replace');scheduleScroll();document.fonts.ready.then(()=>{if(firstHash&&location.hash==='#'+encodeURIComponent(ALIASES[firstHash]||firstHash))land(firstHash,false);else scheduleScroll();});
</script>
</body>
</html>
